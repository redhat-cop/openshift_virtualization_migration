---
# Postflight validates migration outcomes after vmf_migrate completes.
#
# All checks run on every invocation; the summary report (always-tagged)
# fails the play if any ran check failed, so one run reports everything
# that needs attention. The summary asserts only over the checks that
# ran, so an isolated --tags debug run ends green when the targeted
# check passed.
#
# The source power-off is the only mutating step: per-VM and fail-closed
# (docs/adr/0001-postflight-fail-closed-power-off.md). A source VM powers
# off only after its migrated counterpart passed every fatal check —
# plan succeeded, present, running, target list match, and disk
# topology. Warn-only checks (guest agent, IP addresses) never block the
# power-off. Set postflight_power_off_source=false to run read-only; the
# role then reports source power state without mutating.

- name: Include pre-validation of required variables
  ansible.builtin.include_tasks:
    file: pre_validate.yml
    apply:
      tags:
        - always
  tags:
    - always

- name: Run postflight checks
  block:
    - name: Include migration plan status check
      ansible.builtin.include_tasks:
        file: validate_plan.yml
        apply:
          tags:
            - plan
            - validate
      tags:
        - plan
        - validate

    - name: Include migrated VM presence and state check
      ansible.builtin.include_tasks:
        file: validate_vms.yml
        apply:
          tags:
            - vms
            - validate
      tags:
        - vms
        - validate

    - name: Include target list match check
      ansible.builtin.include_tasks:
        file: validate_list.yml
        apply:
          tags:
            - list
            - validate
      tags:
        - list
        - validate

    - name: Include guest agent check
      ansible.builtin.include_tasks:
        file: validate_agent.yml
        apply:
          tags:
            - agent
            - validate
      tags:
        - agent
        - validate

    - name: Include IP address check
      ansible.builtin.include_tasks:
        file: validate_ip.yml
        apply:
          tags:
            - ip
            - validate
      tags:
        - ip
        - validate

    - name: Include disk topology check
      ansible.builtin.include_tasks:
        file: validate_disks.yml
        apply:
          tags:
            - disks
            - validate
      tags:
        - disks
        - validate

    - name: Include the source power-off action
      ansible.builtin.include_tasks:
        file: power_off.yml
        apply:
          tags:
            - poweroff
            - action
      tags:
        - poweroff
        - action

  always:
    - name: Include the postflight summary report
      ansible.builtin.include_tasks:
        file: report.yml
        apply:
          tags:
            - always
      tags:
        - always

...
