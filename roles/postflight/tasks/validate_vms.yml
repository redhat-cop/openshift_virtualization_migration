---
# Check every expected VM exists as a migrated VirtualMachine in the
# target namespace and is Running. MTV preserves VM names, so the input
# name is the migrated VirtualMachine's name.

- name: validate_vms | Query migrated VirtualMachines in the target namespace
  kubernetes.core.k8s_info:
    host: "{{ postflight_openshift_host }}"
    api_key: "{{ postflight_openshift_api_key }}"
    validate_certs: "{{ postflight_openshift_verify_ssl }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ postflight_target_namespace }}"
  register: __postflight_vm_query
  failed_when: false
  no_log: "{{ postflight_secure_logging }}"

- name: validate_vms | Build the per-VM presence and state map
  ansible.builtin.set_fact:
    __postflight_vms_state: >-
      {%- set vms = __postflight_vm_query.resources | default([]) -%}
      {%- set out = {} -%}
      {%- for name in postflight_vm_list -%}
      {%- set vm = vms | selectattr('metadata.name', 'equalto', name) | list | first | default({}) -%}
      {%- set _ = out.update({name: {
        'present': vm | length > 0,
        'running': (vm.status.printableStatus | default('')) == 'Running'
      }}) -%}
      {%- endfor -%}
      {{- out -}}

- name: validate_vms | Record the migrated VM check result
  ansible.builtin.set_fact:
    __postflight_result_vms:
      ran: true
      passed: "{{ (__postflight_vms_state.values()
        | selectattr('running', 'equalto', true) | list | length)
        == (postflight_vm_list | length) }}"
      detail: >-
        {% if __postflight_vm_query.resources is not defined %}
        Cluster API query failed in {{ postflight_target_namespace }} —
        check the OpenShift connection and credentials first; the VM
        check is inconclusive when the API is unreachable
        {% else %}
        {% set missing = __postflight_vms_state.items()
        | selectattr('1.present', 'equalto', false)
        | map(attribute='0') | list %}
        {% set not_running = __postflight_vms_state.items()
        | selectattr('1.present', 'equalto', true)
        | selectattr('1.running', 'equalto', false)
        | map(attribute='0') | list %}
        {% if missing | length > 0 %}
        {{ missing | length }} of {{ postflight_vm_list | length }} VM(s)
        not found in {{ postflight_target_namespace }}:
        {{ missing | join(', ') }} — check the migration plan and the
        VM list
        {% elif not_running | length > 0 %}
        {{ not_running | length }} of {{ postflight_vm_list | length }}
        VM(s) present but not Running:
        {{ not_running | join(', ') }} — expected printableStatus
        Running
        {% else %}
        All {{ postflight_vm_list | length }} VM(s) present and Running
        in {{ postflight_target_namespace }}
        {% endif %}
        {% endif %}

...
