---
- name: Validate global MTU range
  ansible.builtin.assert:
    that:
      - network_mgmt_nad_mtu | int >= 68
      - network_mgmt_nad_mtu | int <= 9000
    fail_msg: >-
      network_mgmt_nad_mtu must be between 68 and 9000,
      got {{ network_mgmt_nad_mtu }}.
  when:
    - network_mgmt_nad_mtu is defined

- name: Use automatic mode
  ansible.builtin.include_tasks:
    file: automatic.yml
  when:
    (network_mgmt_manual_nad_list | default([]) | length) == 0

- name: Use manual mode
  ansible.builtin.include_tasks:
    file: manual.yml
  when:
    - (network_mgmt_manual_nad_list | default([])) is iterable
    - (network_mgmt_manual_nad_list | length) > 0
...
