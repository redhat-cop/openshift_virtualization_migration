---
argument_specs:
  main:
    short_description: >-
      Create MTV/Forklift StorageMap and NetworkMap CRs on OpenShift
    description:
      - >-
        Creates StorageMap and/or NetworkMap custom resources on a target
        OpenShift cluster for a given source-target pair. Queries the MTV
        inventory to discover datastores, storage classes, networks, and
        NADs, then builds and applies the mapping CRs.
      - >-
        Designed to run from AAP with OCP credential injection. The
        OpenShift connection is provided by the AAP OpenShift credential
        which sets K8S_AUTH_* environment variables. Source credentials
        are NOT required — the role queries the MTV inventory which
        already has access to the source environment via its Provider CR.
      - >-
        Uses the mtv_query_inventory role (included via include_role)
        for all MTV inventory API queries.
    options:
      source_name:
        type: str
        required: true
        description: >-
          Name of the source environment (must match an AAP inventory host
          in the vm_sources group).

      target_name:
        type: str
        required: true
        description: >-
          Name of the target OpenShift cluster (must match an AAP inventory
          host in the migration_clusters group).

      mtv_maps_openshift_host:
        type: str
        required: true
        description: >-
          OpenShift host URL. Cascades from K8S_AUTH_HOST env var
          or openshift_host inventory variable.

      mtv_maps_openshift_api_key:
        type: str
        required: true
        description: >-
          OpenShift API key / bearer token. Cascades from K8S_AUTH_API_KEY
          env var or inventory variables.

      mtv_maps_openshift_verify_ssl:
        type: bool
        required: false
        default: true
        description: >-
          Whether to verify SSL certificates for OpenShift connections.

      mtv_maps_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Whether to enable secure logging for sensitive tasks.

      mtv_maps_create_storage_maps:
        type: bool
        required: false
        default: true
        description: >-
          Whether to create StorageMap CRs.

      mtv_maps_create_network_maps:
        type: bool
        required: false
        default: true
        description: >-
          Whether to create NetworkMap CRs.

      mtv_maps_namespace:
        type: str
        required: false
        default: openshift-mtv
        description: >-
          Namespace where the StorageMap and NetworkMap CRs will be created.
          Resolved from the target host's mtv_namespace variable by default.

      mtv_maps_source_provider_name:
        type: str
        required: false
        description: >-
          Name of the source provider in the MTV inventory.
          Defaults to the rfc1123-sanitised source_name.

      mtv_maps_destination_provider_name:
        type: str
        required: false
        default: host
        description: >-
          Name of the destination (OpenShift) provider in the MTV inventory.

      mtv_maps_api_version:
        type: str
        required: false
        default: forklift.konveyor.io/v1beta1
        description: >-
          Forklift API version for map CRs.

      mtv_maps_source_type:
        type: str
        required: false
        default: vmware
        choices:
          - vmware
          - ovirt
        description: >-
          Type of the source environment. Resolved from the source host's
          type variable in the AAP inventory.

      mtv_maps_default_storage_class:
        type: str
        required: false
        default: ""
        description: >-
          Default storage class on the destination cluster. If empty,
          auto-detected from the cluster's default StorageClass annotation.

      mtv_maps_storage_map_overrides:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Per-datastore overrides for the single storage map. Each entry
          may contain id, storageClass, exclude, and include. Ignored
          when mtv_maps_multiple_storage_maps is populated.

      mtv_maps_multiple_storage_maps:
        type: dict
        required: false
        default: {}
        description: >-
          Dictionary of named storage maps. Keys are map names (sanitised
          to RFC 1123), values are lists of per-datastore overrides.
          Takes precedence over mtv_maps_storage_map_overrides.

      mtv_maps_network_map_overrides:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Per-network overrides for the network map. Each entry may
          contain id, destination_type (pod/multus/ignored), nad
          (namespace/name or just name), exclude, and include.

      mtv_maps_nad_source_annotation:
        type: str
        required: false
        default: "infra.openshift-virtualization-migration/source-portgroup"
        description: >-
          Annotation on NetworkAttachmentDefinitions used for
          auto-matching source portgroups to destination NADs.

      mtv_maps_inventory_retrieval_method:
        type: str
        required: false
        default: api
        choices:
          - api
          - exec
        description: >-
          Method used by mtv_query_inventory to retrieve data from
          the MTV inventory service.

      mtv_maps_query_retries:
        type: int
        required: false
        default: 5
        description: >-
          Number of retries for inventory queries.

      mtv_maps_query_delay:
        type: int
        required: false
        default: 5
        description: >-
          Delay in seconds between inventory query retries.
...
