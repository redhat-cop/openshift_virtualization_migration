---
# Query the MTV inventory to discover providers, datastores, storage classes,
# networks, and NADs. Each query uses include_role: mtv_query_inventory.

- name: query_inventory | Query MTV providers
  ansible.builtin.include_role:
    name: infra.openshift_virtualization_migration.mtv_query_inventory
  vars:
    mtv_query_inventory_endpoint_path: /providers?detail=2
    mtv_query_inventory_result_var: _mtv_maps_providers
    mtv_query_inventory_retrieval_method: "{{ mtv_maps_inventory_retrieval_method }}"
    mtv_query_inventory_secure_logging: "{{ mtv_maps_secure_logging }}"
    mtv_query_inventory_namespace: "{{ mtv_maps_namespace }}"
    mtv_query_inventory_query_retries: "{{ mtv_maps_query_retries }}"
    mtv_query_inventory_query_delay: "{{ mtv_maps_query_delay }}"

- name: query_inventory | Set source provider
  ansible.builtin.set_fact:
    _mtv_maps_source_provider: >-
      {{ _mtv_maps_providers | json_query('*[]') |
      selectattr('name', 'equalto', mtv_maps_source_provider_name) |
      selectattr('namespace', 'equalto', mtv_maps_namespace) |
      first | default(None) }}

- name: query_inventory | Assert source provider exists in MTV inventory
  ansible.builtin.assert:
    that:
      - _mtv_maps_source_provider | default('', true) | length > 0
    fail_msg: >-
      Source provider '{{ mtv_maps_source_provider_name }}'
      not found in namespace '{{ mtv_maps_namespace }}'.
    quiet: true

- name: query_inventory | Set destination provider
  ansible.builtin.set_fact:
    _mtv_maps_dest_provider: >-
      {{ _mtv_maps_providers | json_query('*[]') |
      selectattr('name', 'equalto', mtv_maps_destination_provider_name) |
      selectattr('namespace', 'equalto', mtv_maps_namespace) |
      first | default(None) }}

- name: query_inventory | Assert destination provider exists in MTV inventory
  ansible.builtin.assert:
    that:
      - _mtv_maps_dest_provider | default('', true) | length > 0
    fail_msg: >-
      Destination provider '{{ mtv_maps_destination_provider_name }}'
      not found in namespace '{{ mtv_maps_namespace }}'.
    quiet: true

- name: query_inventory | Resolve source-type-specific variables
  ansible.builtin.set_fact:
    _mtv_maps_source_type: "{{ _mtv_maps_source_provider.type }}"
    _mtv_maps_datastore_resource: >-
      {{ 'datastores' if _mtv_maps_source_provider.type == 'vsphere'
         else 'storagedomains' }}

# --- Storage-related queries ---

- name: query_inventory | Query source datastores
  ansible.builtin.include_role:
    name: infra.openshift_virtualization_migration.mtv_query_inventory
  vars:
    mtv_query_inventory_endpoint_path: >-
      /providers/{{ _mtv_maps_source_type }}/{{
      _mtv_maps_source_provider.uid }}/{{
      _mtv_maps_datastore_resource }}?detail=4
    mtv_query_inventory_result_var: _mtv_maps_datastores
    mtv_query_inventory_retrieval_method: "{{ mtv_maps_inventory_retrieval_method }}"
    mtv_query_inventory_secure_logging: "{{ mtv_maps_secure_logging }}"
    mtv_query_inventory_namespace: "{{ mtv_maps_namespace }}"
    mtv_query_inventory_query_retries: "{{ mtv_maps_query_retries }}"
    mtv_query_inventory_query_delay: "{{ mtv_maps_query_delay }}"
  when: mtv_maps_create_storage_maps | bool

- name: query_inventory | Query destination storage classes
  ansible.builtin.include_role:
    name: infra.openshift_virtualization_migration.mtv_query_inventory
  vars:
    mtv_query_inventory_endpoint_path: >-
      /providers/openshift/{{ _mtv_maps_dest_provider.uid }}/storageclasses?detail=4
    mtv_query_inventory_result_var: _mtv_maps_storageclasses
    mtv_query_inventory_retrieval_method: "{{ mtv_maps_inventory_retrieval_method }}"
    mtv_query_inventory_secure_logging: "{{ mtv_maps_secure_logging }}"
    mtv_query_inventory_namespace: "{{ mtv_maps_namespace }}"
    mtv_query_inventory_query_retries: "{{ mtv_maps_query_retries }}"
    mtv_query_inventory_query_delay: "{{ mtv_maps_query_delay }}"
  when: mtv_maps_create_storage_maps | bool

# --- Network-related queries ---

- name: query_inventory | Query source networks
  ansible.builtin.include_role:
    name: infra.openshift_virtualization_migration.mtv_query_inventory
  vars:
    mtv_query_inventory_endpoint_path: >-
      /providers/{{ _mtv_maps_source_type }}/{{
      _mtv_maps_source_provider.uid }}/networks?detail=4
    mtv_query_inventory_result_var: _mtv_maps_networks
    mtv_query_inventory_retrieval_method: "{{ mtv_maps_inventory_retrieval_method }}"
    mtv_query_inventory_secure_logging: "{{ mtv_maps_secure_logging }}"
    mtv_query_inventory_namespace: "{{ mtv_maps_namespace }}"
    mtv_query_inventory_query_retries: "{{ mtv_maps_query_retries }}"
    mtv_query_inventory_query_delay: "{{ mtv_maps_query_delay }}"
  when: mtv_maps_create_network_maps | bool

- name: query_inventory | Query destination network attachment definitions
  ansible.builtin.include_role:
    name: infra.openshift_virtualization_migration.mtv_query_inventory
  vars:
    mtv_query_inventory_endpoint_path: >-
      /providers/openshift/{{ _mtv_maps_dest_provider.uid
      }}/networkattachmentdefinitions?detail=4
    mtv_query_inventory_result_var: _mtv_maps_nads
    mtv_query_inventory_retrieval_method: "{{ mtv_maps_inventory_retrieval_method }}"
    mtv_query_inventory_secure_logging: "{{ mtv_maps_secure_logging }}"
    mtv_query_inventory_namespace: "{{ mtv_maps_namespace }}"
    mtv_query_inventory_query_retries: "{{ mtv_maps_query_retries }}"
    mtv_query_inventory_query_delay: "{{ mtv_maps_query_delay }}"
  when: mtv_maps_create_network_maps | bool
...
