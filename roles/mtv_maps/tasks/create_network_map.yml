---
# Creates a NetworkMap CR based on the queried inventory data,
# annotation-based NAD auto-matching, and user overrides.

- name: create_network_map | Reset state
  ansible.builtin.set_fact:
    _mtv_maps_network_map_entries: []
    _mtv_maps_allowed_net_ids: []
    _mtv_maps_excluded_net_ids: []

- name: create_network_map | Extract included network IDs
  ansible.builtin.set_fact:
    _mtv_maps_allowed_net_ids: >-
      {{ mtv_maps_network_map_overrides
         | selectattr('include', 'defined')
         | selectattr('include', 'equalto', true)
         | map(attribute='id') | list }}
  when: >-
    mtv_maps_network_map_overrides
    | selectattr('include', 'defined') | list | length > 0

- name: create_network_map | Extract excluded network IDs
  ansible.builtin.set_fact:
    _mtv_maps_excluded_net_ids: >-
      {{ mtv_maps_network_map_overrides
         | selectattr('exclude', 'defined')
         | selectattr('exclude', 'equalto', true)
         | map(attribute='id') | list }}
  when: >-
    mtv_maps_network_map_overrides
    | selectattr('exclude', 'defined') | list | length > 0

- name: create_network_map | Filter networks
  ansible.builtin.set_fact:
    _mtv_maps_filtered_networks: >-
      {{
        (_mtv_maps_networks
         | selectattr('id', 'in', _mtv_maps_allowed_net_ids) | list)
        if (_mtv_maps_allowed_net_ids | default([]) | length > 0)
        else
        (_mtv_maps_networks
         | rejectattr('id', 'in', _mtv_maps_excluded_net_ids | default([])) | list)
        if (_mtv_maps_excluded_net_ids | default([]) | length > 0)
        else _mtv_maps_networks
      }}

- name: create_network_map | Build map entries
  ansible.builtin.include_tasks: _resolve_network_destination.yml
  loop: "{{ _mtv_maps_filtered_networks }}"
  loop_control:
    loop_var: _net

- name: create_network_map | Apply NetworkMap CR
  redhat.openshift.k8s:
    host: "{{ mtv_maps_openshift_host }}"
    api_key: "{{ mtv_maps_openshift_api_key }}"
    validate_certs: "{{ mtv_maps_openshift_verify_ssl }}"
    state: present
    apply: true
    definition: >-
      {{ lookup('template', 'networkmap.yml.j2') | from_yaml
         | ansible.builtin.combine(
             {'spec': {'map': _mtv_maps_network_map_entries}},
             recursive=true)
      }}

- name: create_network_map | NetworkMap created successfully
  ansible.builtin.debug:
    msg: >-
      NetworkMap '{{ _mtv_maps_network_map_name }}' applied in
      namespace '{{ mtv_maps_namespace }}' with
      {{ _mtv_maps_network_map_entries | length }} mapping(s).
...
