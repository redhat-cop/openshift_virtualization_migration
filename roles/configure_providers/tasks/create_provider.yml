---
- name: create_provider | Ensure provider secret exists
  redhat.openshift.k8s:
    state: "{{ configure_providers_provider_state }}"
    apply: true
    definition: >-
      {{ lookup('template', 'provider_secret.yml.j2') | from_yaml }}
  no_log: "{{ configure_providers_secure_logging }}"

- name: create_provider | Ensure provider CR exists
  redhat.openshift.k8s:
    state: "{{ configure_providers_provider_state }}"
    apply: true
    definition: >-
      {{ lookup('template', 'provider.yml.j2') | from_yaml
         | ansible.builtin.combine({'spec': configure_providers_provider_override}, recursive=True) }}

- name: create_provider | Wait for provider to become Ready
  kubernetes.core.k8s_info:
    api_version: "{{ configure_providers_api_version }}"
    kind: Provider
    name: "{{ _configure_providers_provider_name }}"
    namespace: "{{ configure_providers_provider_namespace }}"
  register: _configure_providers_result
  until: >-
    _configure_providers_result.resources | length > 0 and
    (_configure_providers_result.resources[0].status.conditions
     | default([])
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True')
     | list
     | length > 0)
  retries: >-
    {{ ((configure_providers_provider_wait_timeout | int) /
        (configure_providers_provider_wait_poll | int)) | int }}
  delay: "{{ configure_providers_provider_wait_poll }}"
  when: configure_providers_provider_wait | bool

- name: create_provider | Provider created successfully
  ansible.builtin.debug:
    msg: >-
      Provider '{{ _configure_providers_provider_name }}' ({{ _configure_providers_forklift_type }})
      is Ready in namespace '{{ configure_providers_provider_namespace }}'
      on target '{{ target_name }}'.
...
