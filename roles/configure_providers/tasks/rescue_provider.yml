---
- name: rescue_provider | Fetch provider status
  kubernetes.core.k8s_info:
    api_version: "{{ configure_providers_api_version }}"
    kind: Provider
    name: "{{ source_name }}"
    namespace: "{{ configure_providers_mtv_namespace }}"
  register: _configure_providers_failed_result
  ignore_errors: true

- name: rescue_provider | Extract error details
  ansible.builtin.set_fact:
    _configure_providers_error_conditions: >-
      {{ _configure_providers_failed_result.resources[0].status.conditions
         | default([]) }}
    _configure_providers_error_phase: >-
      {{ _configure_providers_failed_result.resources[0].status.phase
         | default('Unknown') }}
  when: >-
    _configure_providers_failed_result.resources | default([]) | length > 0

- name: rescue_provider | Display provider error status
  ansible.builtin.debug:
    msg: |
      Provider creation failed for '{{ source_name }}'.

      Provider Details:
        Name:      {{ source_name }}
        Type:      {{ _configure_providers_forklift_type | default('unknown') }}
        URL:       {{ _configure_providers_source_url | default('unknown') }}
        Namespace: {{ configure_providers_mtv_namespace }}
        Phase:     {{ _configure_providers_error_phase | default('Unknown') }}

      Status Conditions:
      {{ _configure_providers_error_conditions | default([])
         | to_nice_yaml }}

      Troubleshooting:
        - Verify the source host ({{ configure_providers_source_host }}) is
          reachable from the OpenShift cluster
        - Check that the source credentials are correct
        - If using TLS, verify the certificate or set
          insecure_skip_tls_verify: true on the source
        - Confirm MTV/Forklift operator is installed and running in
          namespace '{{ configure_providers_mtv_namespace }}'

- name: rescue_provider | Fail with summary
  ansible.builtin.fail:
    msg: >-
      Failed to create provider '{{ source_name }}'
      ({{ _configure_providers_forklift_type | default('unknown') }})
      on target '{{ target_name }}'.
      Phase: {{ _configure_providers_error_phase | default('Unknown') }}.
      Check the debug output above for details.
...
