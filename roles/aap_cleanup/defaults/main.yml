---
# =============================================================================
# aap_cleanup — Remove AAP artifacts created by aap_seed
# =============================================================================
# This role removes the AAP objects that the aap_seed role creates.
# Every object category has a toggle so you can selectively keep items.
# Removal order respects dependencies: templates → credentials →
# credential types → projects → execution environments → hosts →
# inventories → organization.

# ---------------------------------------------------------------------------
# AAP connection (cascaded from inventory, same as aap_seed)
# ---------------------------------------------------------------------------

# title: AAP Hostname
# required: True
# description: Hostname of the AAP instance.
aap_cleanup_hostname: "{{ aap_hostname }}"

# title: AAP Username
# required: False
# description: Username for AAP authentication.
aap_cleanup_username: "{{ aap_username | default(omit) }}"

# title: AAP Password
# required: False
# description: Password for AAP authentication.
aap_cleanup_password: "{{ aap_password | default(omit) }}"

# title: AAP Token
# required: False
# description: OAuth token for AAP authentication.
aap_cleanup_token: "{{ aap_token | default(omit) }}"

# title: Validate Certificates
# required: False
# description: Whether to validate TLS certificates for AAP connections.
aap_cleanup_validate_certs: "{{ aap_validate_certs | default(true) }}"

# ---------------------------------------------------------------------------
# Organization (must match what aap_seed created)
# ---------------------------------------------------------------------------

# title: Organization Name
# required: False
# description: >-
#   The AAP organization to remove. Must match the org created by
#   aap_seed. All objects below are scoped to this organization.
aap_cleanup_org_name: OpenShift Virtualization Migration

# ---------------------------------------------------------------------------
# Master switch
# ---------------------------------------------------------------------------

# title: Remove All
# required: False
# description: >-
#   Master switch — when true, every object category is removed.
#   Set to false to use the individual toggles below for selective
#   removal.
aap_cleanup_all: true

# ---------------------------------------------------------------------------
# Individual toggles (only effective when aap_cleanup_all is false)
# ---------------------------------------------------------------------------

# title: Remove Templates
# required: False
# description: Whether to remove job templates.
aap_cleanup_templates: false

# title: Remove Credentials
# required: False
# description: Whether to remove credentials (source, target, Git, registry).
aap_cleanup_credentials: false

# title: Remove Credential Types
# required: False
# description: Whether to remove custom credential types.
aap_cleanup_credential_types: false

# title: Remove Projects
# required: False
# description: Whether to remove the SCM project.
aap_cleanup_projects: false

# title: Remove Execution Environments
# required: False
# description: Whether to remove execution environment definitions.
aap_cleanup_execution_environments: false

# title: Remove Hosts
# required: False
# description: Whether to remove hosts and groups from the inventory.
aap_cleanup_hosts: false

# title: Remove Inventories
# required: False
# description: Whether to remove the inventory.
aap_cleanup_inventories: false

# title: Remove Organization
# required: False
# description: >-
#   Whether to remove the organization itself. Only removed after all
#   other objects have been deleted. Set to false to keep the org shell.
aap_cleanup_organization: false

# ---------------------------------------------------------------------------
# Object names — default to the same names aap_seed uses
# ---------------------------------------------------------------------------

# title: Job Template Names
# required: False
# description: >-
#   List of job template names to remove. Defaults to all templates
#   created by aap_seed.
aap_cleanup_template_names:
  - OpenShift Virtualization Migration - MTV Provider
  - OpenShift Virtualization Migration - MTV Maps
  - OpenShift Virtualization Migration - MTV Plans
  - OpenShift Virtualization Migration - MTV Migrate
  - OpenShift Virtualization Migration - Pre-Migration VM Operations
  - OpenShift Virtualization Migration - Registry Credentials

# title: Credential Names
# required: False
# description: >-
#   List of credential names to remove. Built dynamically from inventory
#   hosts by default (same logic as aap_seed build_credentials). Set
#   this explicitly to override.
aap_cleanup_credential_names: []

# title: Credential Type Names
# required: False
# description: >-
#   List of custom credential type names to remove. Defaults to the
#   source and target types created by aap_seed.
aap_cleanup_credential_type_names:
  - Migration Factory - Source Environment
  - Migration Factory - Target Environment

# title: Project Name
# required: False
# description: Name of the AAP project to remove.
aap_cleanup_project_name: OpenShift Virtualization Migration

# title: Execution Environment Name
# required: False
# description: >-
#   Name of the execution environment to remove. Cascades from
#   aap_execution_environment.
aap_cleanup_execution_environment_name: >-
  {{ aap_execution_environment |
     default('Default execution environment') }}

# title: Inventory Name
# required: False
# description: Name of the AAP inventory to remove.
aap_cleanup_inventory_name: OpenShift Virtualization Migration

# title: EE Registry Credential Name
# required: False
# description: >-
#   Name of the registry credential to remove (created for EE image
#   pulling). Cascades from aap_execution_environment_credential.
aap_cleanup_ee_credential_name: >-
  {{ aap_execution_environment_credential | default('') }}

# title: Git Credential Name
# required: False
# description: >-
#   Name of the Git credential to remove (created for project SCM).
#   Cascades from aap_project_credential.
aap_cleanup_git_credential_name: >-
  {{ aap_project_credential | default('') }}
...
