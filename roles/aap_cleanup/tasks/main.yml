---
- name: Ensure AAP API credentials are set
  ansible.builtin.assert:
    that:
      - aap_cleanup_controller_hostname | default("", true) | trim | length > 0
      - >-
        (aap_cleanup_controller_username | default("", true) | trim | length > 0 and
        aap_cleanup_controller_password | default("", true) | trim | length > 0) or
        aap_cleanup_controller_token | default("", true) | trim | length > 0
    fail_msg: "AAP API credentials are not set. Check controller_hostname and username/password or token."

- name: Build authentication headers
  ansible.builtin.set_fact:
    _aap_cleanup_auth_headers: >-
      {{ {'Authorization': 'Bearer ' ~ aap_cleanup_controller_token}
      if aap_cleanup_controller_token | default("", true) | trim | length > 0
      else {} }}
    _aap_cleanup_force_basic_auth: >-
      {{ aap_cleanup_controller_token | default("", true) | trim | length == 0 }}
  no_log: "{{ aap_cleanup_secure_logging }}"

- name: Resolve organization ID
  ansible.builtin.uri:
    url: >-
      https://{{ aap_cleanup_controller_hostname }}{{ aap_cleanup_api_base
      }}/organizations/?name={{ aap_cleanup_aap_org_name | urlencode }}
    method: GET
    headers: "{{ _aap_cleanup_auth_headers }}"
    user: "{{ aap_cleanup_controller_username if _aap_cleanup_force_basic_auth else omit }}"
    password: "{{ aap_cleanup_controller_password if _aap_cleanup_force_basic_auth else omit }}"
    force_basic_auth: "{{ _aap_cleanup_force_basic_auth }}"
    validate_certs: "{{ aap_cleanup_controller_validate_certs }}"
    body_format: json
    status_code: [200]
  register: _aap_cleanup_org_result
  no_log: "{{ aap_cleanup_secure_logging }}"

- name: Set organization ID
  ansible.builtin.set_fact:
    _aap_cleanup_org_id: "{{ _aap_cleanup_org_result.json.results[0].id }}"
  when: _aap_cleanup_org_result.json.count > 0

- name: Discover and remove AAP resources
  when: _aap_cleanup_org_id is defined
  block:
    - name: Remove workflow job templates
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: workflow_job_templates
        _aap_cleanup_dispatch_var: controller_workflows
      when: aap_cleanup_workflows_remove | bool

    - name: Remove job templates
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: job_templates
        _aap_cleanup_dispatch_var: controller_templates
      when: aap_cleanup_job_templates_remove | bool

    - name: Remove hosts
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: hosts
        _aap_cleanup_dispatch_var: controller_hosts
        _aap_cleanup_extra_fields:
          - inventory
        _aap_cleanup_use_org_filter: false
      when: aap_cleanup_hosts_remove | bool

    - name: Remove inventories
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: inventories
        _aap_cleanup_dispatch_var: controller_inventories
      when: aap_cleanup_inventories_remove | bool

    - name: Remove projects
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: projects
        _aap_cleanup_dispatch_var: controller_projects
      when: aap_cleanup_projects_remove | bool

    - name: Remove execution environments
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: execution_environments
        _aap_cleanup_dispatch_var: controller_execution_environments
      when: aap_cleanup_execution_environments_remove | bool

    - name: Remove credentials
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: credentials
        _aap_cleanup_dispatch_var: controller_credentials
        _aap_cleanup_extra_fields:
          - credential_type
      when: aap_cleanup_credentials_remove | bool

    - name: Remove credential types
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: credential_types
        _aap_cleanup_dispatch_var: controller_credential_types
        _aap_cleanup_filter_managed: true
        _aap_cleanup_use_org_filter: false
      when: aap_cleanup_credential_types_remove | bool

    - name: Remove organization
      ansible.builtin.include_tasks:
        file: _build_absent_resources.yml
      vars:
        _aap_cleanup_resource_type: organizations
        _aap_cleanup_dispatch_var: >-
          {{ 'controller_organizations'
          if aap_version is defined and aap_version is version('2.5', '<')
          else 'aap_organizations' }}
        _aap_cleanup_use_org_filter: false
      when: aap_cleanup_organization_remove | bool

    - name: Purge job history
      ansible.builtin.include_tasks:
        file: _cleanup_job_history.yml
      when: aap_cleanup_job_history_purge | bool
...
