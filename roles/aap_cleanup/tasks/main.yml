---
- name: Remove AAP artifacts created by aap_seed
  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ aap_cleanup_hostname }}"
      controller_username: "{{ aap_cleanup_username | default(omit, true) }}"
      controller_password: "{{ aap_cleanup_password | default(omit, true) }}"
      controller_oauthtoken: "{{ aap_cleanup_token | default(omit, true) }}"
      validate_certs: "{{ aap_cleanup_validate_certs }}"
  block:
    # 1. Job templates (depend on project, inventory, EE, credentials)
    - name: Remove job templates
      ansible.controller.job_template:
        name: "{{ __aap_cleanup_template }}"
        organization: "{{ aap_cleanup_org_name }}"
        state: absent
      loop: "{{ aap_cleanup_template_names }}"
      loop_control:
        loop_var: __aap_cleanup_template
        label: "{{ __aap_cleanup_template }}"
      when: aap_cleanup_all | bool or aap_cleanup_templates | bool

    # 2. Credentials (depend on credential types)
    - name: Remove credentials
      when: aap_cleanup_all | bool or aap_cleanup_credentials | bool
      block:
        - name: Build credential list from inventory
          when: aap_cleanup_credential_names | length == 0
          ansible.builtin.set_fact:
            __aap_cleanup_credential_list: >-
              {{
                (groups['vm_sources'] | default([])
                  | map('regex_replace', '^(.*)$', '{"name": "\1", "credential_type": "' ~ aap_cleanup_credential_type_names[0] | default("Migration Factory - Source Environment") ~ '"}')
                  | map('from_json')
                  | list)
                +
                (groups['migration_clusters'] | default([])
                  | map('regex_replace', '^(.*)$', '{"name": "\1", "credential_type": "' ~ aap_cleanup_credential_type_names[1] | default("Migration Factory - Target Environment") ~ '"}')
                  | map('from_json')
                  | list)
                +
                ([{"name": aap_cleanup_ee_credential_name, "credential_type": "Container Registry"}] if aap_cleanup_ee_credential_name | length > 0 else [])
                +
                ([{"name": aap_cleanup_git_credential_name, "credential_type": "Source Control"}] if aap_cleanup_git_credential_name | length > 0 else [])
              }}

        - name: Use explicit credential names
          when: aap_cleanup_credential_names | length > 0
          ansible.builtin.set_fact:
            __aap_cleanup_credential_list: >-
              {{ aap_cleanup_credential_names
                 | map('regex_replace', '^(.*)$', '{"name": "\1", "credential_type": "' ~ aap_cleanup_credential_type_names[0] | default("Migration Factory - Source Environment") ~ '"}')
                 | map('from_json')
                 | list }}

        - name: Remove credentials
          ansible.controller.credential:
            name: "{{ __aap_cleanup_credential.name }}"
            organization: "{{ aap_cleanup_org_name }}"
            credential_type: "{{ __aap_cleanup_credential.credential_type }}"
            state: absent
          loop: "{{ __aap_cleanup_credential_list | default([]) }}"
          loop_control:
            loop_var: __aap_cleanup_credential
            label: "{{ __aap_cleanup_credential.name }}"
          ignore_errors: true

    # 3. Credential types
    - name: Remove credential types
      ansible.controller.credential_type:
        name: "{{ __aap_cleanup_cred_type }}"
        state: absent
      loop: "{{ aap_cleanup_credential_type_names }}"
      loop_control:
        loop_var: __aap_cleanup_cred_type
        label: "{{ __aap_cleanup_cred_type }}"
      when: aap_cleanup_all | bool or aap_cleanup_credential_types | bool
      ignore_errors: true

    # 4. Project (depends on org)
    - name: Remove project
      ansible.controller.project:
        name: "{{ aap_cleanup_project_name }}"
        organization: "{{ aap_cleanup_org_name }}"
        state: absent
      when: aap_cleanup_all | bool or aap_cleanup_projects | bool

    # 5. Execution environments
    - name: Remove execution environment
      ansible.controller.execution_environment:
        name: "{{ aap_cleanup_execution_environment_name }}"
        organization: "{{ aap_cleanup_org_name }}"
        state: absent
      when:
        - aap_cleanup_all | bool or aap_cleanup_execution_environments | bool
        - aap_cleanup_execution_environment_name | length > 0

    # 6. Hosts (must be removed before inventory)
    - name: Remove hosts from inventory
      when: aap_cleanup_all | bool or aap_cleanup_hosts | bool
      block:
        - name: Build host list from inventory groups
          ansible.builtin.set_fact:
            __aap_cleanup_host_names: >-
              {{
                (groups['vm_sources'] | default([]))
                +
                (groups['migration_clusters'] | default([]))
              }}

        - name: Remove hosts
          ansible.controller.host:
            name: "{{ __aap_cleanup_host }}"
            inventory: "{{ aap_cleanup_inventory_name }}"
            state: absent
          loop: "{{ __aap_cleanup_host_names }}"
          loop_control:
            loop_var: __aap_cleanup_host
            label: "{{ __aap_cleanup_host }}"
          ignore_errors: true

    # 7. Inventory
    - name: Remove inventory
      ansible.controller.inventory:
        name: "{{ aap_cleanup_inventory_name }}"
        organization: "{{ aap_cleanup_org_name }}"
        state: absent
      when: aap_cleanup_all | bool or aap_cleanup_inventories | bool

    # 8. Organization (last — everything else must be gone first)
    - name: Remove organization
      ansible.platform.organization:
        name: "{{ aap_cleanup_org_name }}"
        state: absent
        gateway_hostname: "{{ aap_cleanup_hostname }}"
        gateway_username: "{{ aap_cleanup_username | default(omit, true) }}"
        gateway_password: "{{ aap_cleanup_password | default(omit, true) }}"
        gateway_token: "{{ aap_cleanup_token | default(omit, true) }}"
        gateway_validate_certs: "{{ aap_cleanup_validate_certs }}"
      when: aap_cleanup_all | bool or aap_cleanup_organization | bool
...
