---
# Custom credential type definitions for AAP.
# Injector values use !unsafe to prevent Ansible templating;
# AAP evaluates them when the credential is consumed at job runtime.

__aap_seed_credential_types:
  - name: "{{ aap_seed_source_credential_type }}"
    organization: "{{ aap_seed_org_name }}"
    description: >-
      Source hypervisor environment credentials used by the Migration Factory.
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: Hostname or IP
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
        - id: certificate
          type: string
          label: SSL/TLS CA Certificate
          multiline: true
          secret: true
        - id: insecure_skip_tls_verify
          type: boolean
          label: Insecure Skip TLS Verify
      required:
        - host
        - username
        - password
    injectors:
      extra_vars:
        mf_source_host: !unsafe "{{ host }}"
        mf_source_username: !unsafe "{{ username }}"
        mf_source_password: !unsafe "{{ password }}"
        mf_source_certificate: !unsafe "{{ certificate }}"
        mf_insecure_skip_tls_verify: !unsafe "{{ insecure_skip_tls_verify }}"
...
