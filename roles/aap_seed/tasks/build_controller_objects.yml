---
# controller_* variable names are the interface contract with
# infra.aap_configuration.dispatch and cannot be renamed.

- name: build_controller_objects | Set credential type definitions # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_credential_types: "{{ __aap_seed_credential_types }}"

- name: build_controller_objects | Initialize dynamic object lists # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_hosts: []
    controller_credentials: []

- name: build_controller_objects | Build source environment hosts and credentials # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_hosts: "{{ controller_hosts + [__aap_seed_host] }}"
    controller_credentials: >-
      {{ controller_credentials + [__aap_seed_cred] }}
  loop: "{{ groups[aap_seed_source_inventory_group] | default([]) }}"
  loop_control:
    loop_var: __aap_seed_source
    label: "{{ __aap_seed_source }}"
  no_log: "{{ aap_seed_secure_logging }}"
  vars:
    __aap_seed_vars: "{{ hostvars[__aap_seed_source] }}"
    __aap_seed_host:
      name: "{{ __aap_seed_source }}"
      inventory: "{{ aap_seed_inventory_name }}"
      variables:
        type: "{{ __aap_seed_vars['type'] | default('vmware') }}"
        host: "{{ __aap_seed_vars['host'] }}"
        sdk_endpoint: >-
          {{ __aap_seed_vars['sdk_endpoint'] | default('/sdk') }}
    __aap_seed_cred:
      name: "{{ __aap_seed_source }}"
      organization: "{{ aap_seed_org_name }}"
      credential_type: "{{ aap_seed_source_credential_type }}"
      inputs:
        host: "{{ __aap_seed_vars['host'] }}"
        username: "{{ __aap_seed_vars['username'] }}"
        password: "{{ __aap_seed_vars['password'] }}"
        insecure_skip_tls_verify: >-
          {{ __aap_seed_vars['insecure_skip_tls_verify']
             | default(false) }}
        certificate: >-
          {{ __aap_seed_vars['certificate'] | default('') }}

- name: build_controller_objects | Validate target hosts have a bearer token
  ansible.builtin.assert:
    that:
      - >-
        hostvars[__aap_seed_target]['openshift_api_key'] is defined or
        hostvars[__aap_seed_target]['openshift_temporary_api_key']
        is defined
    fail_msg: >-
      Target host {{ __aap_seed_target }} must define
      openshift_api_key or openshift_temporary_api_key.
    quiet: true
  loop: "{{ groups[aap_seed_target_inventory_group] | default([]) }}"
  loop_control:
    loop_var: __aap_seed_target
    label: "{{ __aap_seed_target }}"

- name: build_controller_objects | Build target cluster hosts and credentials # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_hosts: "{{ controller_hosts + [__aap_seed_host] }}"
    controller_credentials: >-
      {{ controller_credentials + [__aap_seed_cred] }}
  loop: "{{ groups[aap_seed_target_inventory_group] | default([]) }}"
  loop_control:
    loop_var: __aap_seed_target
    label: "{{ __aap_seed_target }}"
  no_log: "{{ aap_seed_secure_logging }}"
  vars:
    __aap_seed_vars: "{{ hostvars[__aap_seed_target] }}"
    __aap_seed_bearer_token: >-
      {{ __aap_seed_vars['openshift_api_key']
         | default(__aap_seed_vars['openshift_temporary_api_key']) }}
    __aap_seed_host:
      name: "{{ __aap_seed_target }}"
      inventory: "{{ aap_seed_inventory_name }}"
      variables:
        openshift_host: "{{ __aap_seed_vars['openshift_host'] }}"
        mtv_namespace: >-
          {{ __aap_seed_vars['mtv_namespace']
             | default('openshift-mtv') }}
        default_target_namespace: >-
          {{ __aap_seed_vars['default_target_namespace']
             | default('') }}
        vm_sources: >-
          {{ __aap_seed_vars['vm_sources'] | default([]) }}
    __aap_seed_cred:
      name: "{{ __aap_seed_target }}"
      organization: "{{ aap_seed_org_name }}"
      credential_type: "{{ aap_seed_target_credential_type }}"
      inputs:
        host: "{{ __aap_seed_vars['openshift_host'] }}"
        bearer_token: "{{ __aap_seed_bearer_token }}"
        verify_ssl: >-
          {{ __aap_seed_vars['openshift_verify_ssl']
             | default(true) }}

- name: build_controller_objects | Build inventory groups # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_groups:
      - name: "{{ aap_seed_source_inventory_group }}"
        inventory: "{{ aap_seed_inventory_name }}"
        hosts: >-
          {{ groups[aap_seed_source_inventory_group]
             | default([]) }}
      - name: "{{ aap_seed_target_inventory_group }}"
        inventory: "{{ aap_seed_inventory_name }}"
        hosts: >-
          {{ groups[aap_seed_target_inventory_group]
             | default([]) }}
...
