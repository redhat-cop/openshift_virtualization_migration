---
# Migration validation role defaults.
#
# Connection variables cascade from AAP-injected environment variables to
# inventory host variables resolved through the target and source host
# names below, so the role runs identically from an AAP job template
# (target credential injects K8S_AUTH_*, source credential injects
# VMWARE_*) and from a controller with the sample inventory.

# Resolver options — the inventory hosts whose variables feed the checks.
# target_name and source_name match the names the seeded credentials
# inject as extra vars; each falls back to the first host of its group.
validate_migration_target_name: "{{ target_name
  | default(groups['migration_clusters'] | default([], true)
  | first | default('', true), true) }}"
validate_migration_source_name: "{{ source_name
  | default(groups['vm_sources'] | default([], true)
  | first | default('', true), true) }}"

# Secure logging toggle for tasks that handle credentials.
# NEVER hardcode no_log: true — always reference this variable so failures
# can be debugged with validate_migration_secure_logging=false.
validate_migration_secure_logging: "{{ secure_logging | default(true) }}"

# title: OpenShift Host
# required: True
# description: >-
#   OpenShift API endpoint. Cascades from K8S_AUTH_HOST env var (injected
#   by the AAP target credential) or the openshift_host variable on the
#   target cluster host (validate_migration_target_name).
validate_migration_openshift_host: >-
  {{
    lookup('env', 'K8S_AUTH_HOST')
    | default(hostvars[validate_migration_target_name]['openshift_host'] | default('', true), true)
  }}

# title: OpenShift API Key
# required: True
# description: >-
#   OpenShift API token. Cascades from K8S_AUTH_API_KEY env var (injected
#   by the AAP target credential) or the openshift_api_key variable on the
#   target cluster host (validate_migration_target_name), falling back to
#   openshift_temporary_api_key.
validate_migration_openshift_api_key: >-
  {{
    lookup('env', 'K8S_AUTH_API_KEY')
    | default(
        hostvars[validate_migration_target_name]['openshift_api_key']
        | default(hostvars[validate_migration_target_name]['openshift_temporary_api_key'] | default('', true), true),
        true
      )
  }}

# title: OpenShift Verify SSL
# required: False
# description: >-
#   Validate the OpenShift API TLS certificate. Cascades from
#   K8S_AUTH_VERIFY_SSL env var or the openshift_verify_ssl variable on
#   the target cluster host. Defaults to true; the bool cast keeps the
#   argument-spec type honest when a raw env string feeds the value.
validate_migration_openshift_verify_ssl: "{{ (lookup('env', 'K8S_AUTH_VERIFY_SSL')
  | default(hostvars[validate_migration_target_name]['openshift_verify_ssl'] | default(true), true)) | bool }}"

# title: vCenter Hostname
# required: False
# description: >-
#   vCenter endpoint for the source VM checks. Cascades from VMWARE_HOST
#   env var (injected by the AAP source credential) or the host variable
#   on the source host (validate_migration_source_name). When unset, the source
#   checks fail with instructions.
validate_migration_vcenter_hostname: >-
  {{
    lookup('env', 'VMWARE_HOST')
    | default(hostvars[validate_migration_source_name]['host'] | default('', true), true)
  }}

# title: vCenter Username
# required: False
# description: >-
#   vCenter username. Cascades from VMWARE_USER env var or the username
#   variable on the source host (validate_migration_source_name).
validate_migration_vcenter_username: >-
  {{
    lookup('env', 'VMWARE_USER')
    | default(hostvars[validate_migration_source_name]['username'] | default('', true), true)
  }}

# title: vCenter Password
# required: False
# description: >-
#   vCenter password. Cascades from VMWARE_PASSWORD env var or the
#   password variable on the source host (validate_migration_source_name). When
#   the source power-off toggle is on, the credential needs the power
#   off permission — a read-only credential validates but cannot cut
#   over.
validate_migration_vcenter_password: >-
  {{
    lookup('env', 'VMWARE_PASSWORD')
    | default(hostvars[validate_migration_source_name]['password'] | default('', true), true)
  }}

# title: vCenter Verify SSL
# required: False
# description: >-
#   Validate the vCenter TLS certificate. Cascades from
#   VMWARE_VALIDATE_CERTS env var or the validate_certs variable on the
#   source host. Defaults to true. The inner default carries a single
#   argument so an explicit false survives the cascade — a two-argument
#   default would convert the inventory false to true.
validate_migration_vcenter_validate_certs: "{{ (lookup('env', 'VMWARE_VALIDATE_CERTS')
  | default(hostvars[validate_migration_source_name]['validate_certs'] | default(true), true)) | bool }}"

# title: vCenter Datacenter
# required: False
# description: >-
#   Datacenter to look source VMs up in. Required only when a VM name is
#   not unique across the vCenter. Cascades from the datacenter variable
#   on the source host.
validate_migration_vcenter_datacenter: >-
  {{ hostvars[validate_migration_source_name]['datacenter'] | default('', true) }}

# title: Migration Plan Name
# required: True
# description: >-
#   Name of the MTV (Forklift) Plan whose migration validate_migration validates.
#   Defaults to the mtv_migrate_plan_name variable so validate_migration runs
#   seamlessly after vmf_migrate with the same extra vars.
validate_migration_plan_name: "{{ mtv_migrate_plan_name | default('', true) }}"

# title: Migration Plan Namespace
# required: True
# description: >-
#   Namespace holding the migration Plan and its Migration objects.
#   Defaults to the mtv_migrate_plan_namespace variable.
validate_migration_plan_namespace: "{{ mtv_migrate_plan_namespace | default('', true) }}"

# title: Target Namespace
# required: False
# description: >-
#   Namespace holding the migrated VirtualMachines — the Plan's target
#   namespace. Defaults to the Plan namespace.
validate_migration_target_namespace: "{{ validate_migration_plan_namespace }}"

# title: VM List
# required: True
# description: >-
#   Explicit list of source VM names to validate. MTV preserves VM
#   names, so each name is also the migrated VirtualMachine's name in
#   the target namespace.
validate_migration_vm_list: []

# title: Source Power-Off
# required: False
# description: >-
#   Power off source VMs whose migrated counterpart passed every fatal
#   check (per-VM, fail-closed — see docs/adr/0001-validate_migration-fail-closed
#   -power-off.md). The power-off is a hard stop via the vCenter API and
#   the only sanctioned mutation in this role. Set false to run
#   read-only: the role then reports source power state without
#   mutating.
validate_migration_power_off_source: true

...
