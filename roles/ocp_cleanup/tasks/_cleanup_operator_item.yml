---
- name: "_cleanup_operator_item | Set operator definition — {{ _ocp_cleanup_operator_name }}"
  ansible.builtin.set_fact:
    _ocp_cleanup_op_def: "{{ ocp_cleanup_operator_definitions[_ocp_cleanup_operator_name] }}"

- name: "_cleanup_operator_item | Report operator — {{ _ocp_cleanup_operator_name }}"
  ansible.builtin.debug:
    msg: >-
      Operator {{ _ocp_cleanup_operator_name }}: namespace={{ _ocp_cleanup_op_def.namespace }}
      {{ '— DRY RUN, skipping removal' if ocp_cleanup_dry_run else '— removing' }}

- name: "_cleanup_operator_item | Remove extra resources — {{ _ocp_cleanup_operator_name }}"
  when:
    - _ocp_cleanup_op_def.extra_resources | length > 0
    - not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ _ocp_cleanup_op_def.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
    wait: true
    wait_timeout: "{{ ocp_cleanup_wait_retries * ocp_cleanup_wait_delay }}"
  loop: "{{ _ocp_cleanup_op_def.extra_resources }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false

- name: "_cleanup_operator_item | Query CSVs — {{ _ocp_cleanup_operator_name }}"
  when: not (ocp_cleanup_dry_run | bool)
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ _ocp_cleanup_op_def.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  register: _ocp_cleanup_csvs
  failed_when: false

- name: "_cleanup_operator_item | Remove CSVs — {{ _ocp_cleanup_operator_name }}"
  when:
    - not (ocp_cleanup_dry_run | bool)
    - _ocp_cleanup_csvs.resources | default([]) | length > 0
  redhat.openshift.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ item.metadata.name }}"
    namespace: "{{ _ocp_cleanup_op_def.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  loop: "{{ _ocp_cleanup_csvs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false

- name: "_cleanup_operator_item | Remove Subscription — {{ _ocp_cleanup_operator_name }}"
  when: not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ _ocp_cleanup_op_def.subscription }}"
    namespace: "{{ _ocp_cleanup_op_def.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  failed_when: false

- name: "_cleanup_operator_item | Remove OperatorGroup — {{ _ocp_cleanup_operator_name }}"
  when: not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    name: "{{ _ocp_cleanup_op_def.operatorgroup }}"
    namespace: "{{ _ocp_cleanup_op_def.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  failed_when: false

- name: "_cleanup_operator_item | Remove Namespace {{ _ocp_cleanup_op_def.namespace }}"
  when: not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ _ocp_cleanup_op_def.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
    wait: true
    wait_timeout: "{{ ocp_cleanup_wait_retries * ocp_cleanup_wait_delay }}"
  failed_when: false
...
