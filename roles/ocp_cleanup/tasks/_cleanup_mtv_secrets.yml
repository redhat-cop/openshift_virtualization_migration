---
- name: _cleanup_mtv_secrets | Query secrets in MTV namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ocp_cleanup_mtv_namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  register: _ocp_cleanup_secrets_result
  failed_when: false

- name: _cleanup_mtv_secrets | Filter provider and VDDK secrets
  when: _ocp_cleanup_secrets_result is not failed
  ansible.builtin.set_fact:
    _ocp_cleanup_target_secrets: >-
      {{ _ocp_cleanup_secrets_result.resources | default([])
      | selectattr('type', 'equalto', 'Opaque')
      | rejectattr('metadata.name', 'match', '^(default-token|builder-token|deployer-token|sh\.helm)')
      | list }}

- name: _cleanup_mtv_secrets | Report secrets found
  ansible.builtin.debug:
    msg: >-
      Secrets: found {{ (_ocp_cleanup_target_secrets | default([])) | length }} migration secret(s)
      {{ '— DRY RUN, skipping deletion' if ocp_cleanup_dry_run else '— removing' }}

- name: _cleanup_mtv_secrets | Display secrets to remove
  when: (_ocp_cleanup_target_secrets | default([])) | length > 0
  ansible.builtin.debug:
    msg: "{{ _ocp_cleanup_target_secrets | map(attribute='metadata') | map(attribute='name') | list }}"

- name: _cleanup_mtv_secrets | Remove provider and VDDK secrets
  when:
    - (_ocp_cleanup_target_secrets | default([])) | length > 0
    - not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item.metadata.name }}"
    namespace: "{{ ocp_cleanup_mtv_namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  loop: "{{ _ocp_cleanup_target_secrets }}"
  loop_control:
    label: "{{ item.metadata.name }}"
...
