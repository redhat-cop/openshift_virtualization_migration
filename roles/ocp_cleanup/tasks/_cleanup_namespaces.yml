---
- name: _cleanup_namespaces | Report target namespaces
  ansible.builtin.debug:
    msg: >-
      Target namespaces: {{ ocp_cleanup_target_namespaces | length }} namespace(s) to remove
      {{ '— DRY RUN, skipping deletion' if ocp_cleanup_dry_run else '— removing' }}

- name: _cleanup_namespaces | Display target namespaces
  when: ocp_cleanup_target_namespaces | length > 0
  ansible.builtin.debug:
    msg: "{{ ocp_cleanup_target_namespaces }}"

- name: _cleanup_namespaces | Remove target namespaces
  when:
    - ocp_cleanup_target_namespaces | length > 0
    - not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
    wait: true
    wait_timeout: "{{ ocp_cleanup_wait_retries * ocp_cleanup_wait_delay }}"
  loop: "{{ ocp_cleanup_target_namespaces }}"
  loop_control:
    label: "{{ item }}"
  failed_when: false
...
