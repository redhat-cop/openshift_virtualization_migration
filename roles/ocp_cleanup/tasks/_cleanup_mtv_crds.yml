---
- name: "_cleanup_mtv_crds | Query CRD resources — {{ _ocp_cleanup_crd.kind }}"
  kubernetes.core.k8s_info:
    api_version: "{{ _ocp_cleanup_crd.api_version }}"
    kind: "{{ _ocp_cleanup_crd.kind }}"
    namespace: "{{ ocp_cleanup_mtv_namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  register: _ocp_cleanup_crd_results
  failed_when: false

- name: "_cleanup_mtv_crds | Report CRD resources found — {{ _ocp_cleanup_crd.kind }}"
  ansible.builtin.debug:
    msg: >-
      {{ _ocp_cleanup_crd.kind }}: found {{ (_ocp_cleanup_crd_results.resources | default([])) | length }} resource(s)
      {{ '— DRY RUN, skipping deletion' if ocp_cleanup_dry_run else '— removing' }}

- name: "_cleanup_mtv_crds | Display CRD resources — {{ _ocp_cleanup_crd.kind }}"
  when:
    - _ocp_cleanup_crd_results is not failed
    - _ocp_cleanup_crd_results.resources | default([]) | length > 0
  ansible.builtin.debug:
    msg: "{{ _ocp_cleanup_crd_results.resources | map(attribute='metadata') | map(attribute='name') | list }}"

- name: "_cleanup_mtv_crds | Remove CRD resources — {{ _ocp_cleanup_crd.kind }}"
  when:
    - _ocp_cleanup_crd_results is not failed
    - _ocp_cleanup_crd_results.resources | default([]) | length > 0
    - not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: "{{ _ocp_cleanup_crd.api_version }}"
    kind: "{{ _ocp_cleanup_crd.kind }}"
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
    wait: true
    wait_timeout: "{{ ocp_cleanup_wait_retries * ocp_cleanup_wait_delay }}"
  loop: "{{ _ocp_cleanup_crd_results.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
...
