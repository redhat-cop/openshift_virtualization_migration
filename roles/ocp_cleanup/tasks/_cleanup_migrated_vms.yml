---
- name: _cleanup_migrated_vms | Query migrated VirtualMachines across target namespaces
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ item }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  register: _ocp_cleanup_vms_result
  loop: "{{ ocp_cleanup_target_namespaces }}"
  failed_when: false
  when: ocp_cleanup_target_namespaces | length > 0

- name: _cleanup_migrated_vms | Flatten VM results
  ansible.builtin.set_fact:
    _ocp_cleanup_all_vms: >-
      {{ _ocp_cleanup_vms_result.results | default([])
      | selectattr('resources', 'defined')
      | map(attribute='resources')
      | flatten
      | list }}

- name: _cleanup_migrated_vms | Report VMs found
  ansible.builtin.debug:
    msg: >-
      VirtualMachines: found {{ _ocp_cleanup_all_vms | length }} VM(s)
      {{ '— DRY RUN, skipping deletion' if ocp_cleanup_dry_run else '— removing' }}

- name: _cleanup_migrated_vms | Remove VirtualMachines
  when:
    - _ocp_cleanup_all_vms | length > 0
    - not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
    wait: true
    wait_timeout: "{{ ocp_cleanup_wait_retries * ocp_cleanup_wait_delay }}"
  loop: "{{ _ocp_cleanup_all_vms }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: _cleanup_migrated_vms | Query PVCs in target namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ item }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  register: _ocp_cleanup_pvcs_result
  loop: "{{ ocp_cleanup_target_namespaces }}"
  failed_when: false
  when: ocp_cleanup_target_namespaces | length > 0

- name: _cleanup_migrated_vms | Flatten PVC results
  ansible.builtin.set_fact:
    _ocp_cleanup_all_pvcs: >-
      {{ _ocp_cleanup_pvcs_result.results | default([])
      | selectattr('resources', 'defined')
      | map(attribute='resources')
      | flatten
      | list }}

- name: _cleanup_migrated_vms | Report PVCs found
  ansible.builtin.debug:
    msg: >-
      PVCs: found {{ _ocp_cleanup_all_pvcs | length }} PVC(s)
      {{ '— DRY RUN, skipping deletion' if ocp_cleanup_dry_run else '— removing' }}

- name: _cleanup_migrated_vms | Remove PVCs
  when:
    - _ocp_cleanup_all_pvcs | length > 0
    - not (ocp_cleanup_dry_run | bool)
  redhat.openshift.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    host: "{{ ocp_cleanup_openshift_host | default(omit) }}"
    api_key: "{{ ocp_cleanup_openshift_api_key | default(omit) }}"
    validate_certs: "{{ ocp_cleanup_openshift_verify_ssl }}"
  loop: "{{ _ocp_cleanup_all_pvcs }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
...
