---
# OpenShift connection
ocp_cleanup_openshift_host: >-
  {{ openshift_host | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST')) }}
ocp_cleanup_openshift_api_key: >-
  {{ openshift_api_key | default(lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY')) }}
ocp_cleanup_openshift_verify_ssl: "{{ openshift_verify_ssl | default(true) }}"

# MTV namespace
ocp_cleanup_mtv_namespace: "{{ mtv_management_namespace | default('openshift-mtv') }}"

# Provider filtering
ocp_cleanup_providers: "{{ cleanup_providers | default(['vmware', 'ovirt']) }}"

# Scope toggles
ocp_cleanup_mtv_migrations_remove: true
ocp_cleanup_mtv_plans_remove: true
ocp_cleanup_mtv_maps_remove: true
ocp_cleanup_mtv_providers_remove: true
ocp_cleanup_mtv_secrets_remove: true
ocp_cleanup_migrated_vms_remove: false
ocp_cleanup_target_namespaces_remove: false
ocp_cleanup_operators_remove: false

# Dry-run mode — query and report only, no deletions
ocp_cleanup_dry_run: false

# Operator list — matches operator_management_default_operators
ocp_cleanup_operators:
  - mtv
  - cnv
  - acm
  - oadp
  - far
  - nmstate
  - nho
  - gitops

# Operator definitions — mirrors operator_management defaults
ocp_cleanup_operator_definitions:
  mtv:
    namespace: openshift-mtv
    operatorgroup: migration
    subscription: mtv-operator
    extra_resources:
      - api_version: forklift.konveyor.io/v1beta1
        kind: ForkliftController
        name: forklift-controller
  cnv:
    namespace: openshift-cnv
    operatorgroup: kubevirt-hyperconverged-group
    subscription: kubevirt-hyperconverged
    extra_resources:
      - api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        name: kubevirt-hyperconverged
  acm:
    namespace: open-cluster-management
    operatorgroup: acm-operator
    subscription: advanced-cluster-management
    extra_resources:
      - api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        name: multiclusterhub
  oadp:
    namespace: openshift-adp
    operatorgroup: redhat-oadp-operator-group
    subscription: redhat-oadp-operator
    extra_resources: []
  far:
    namespace: openshift-workload-availability
    operatorgroup: openshift-workload-availability-operator-group
    subscription: fence-agents-remediation
    extra_resources: []
  nmstate:
    namespace: openshift-nmstate
    operatorgroup: nmstate-operator-group
    subscription: kubernetes-nmstate-operator
    extra_resources:
      - api_version: nmstate.io/v1
        kind: NMState
        name: nmstate
  nho:
    namespace: openshift-workload-availability
    operatorgroup: openshift-workload-availability-operator-group
    subscription: node-healthcheck-operator
    extra_resources: []
  gitops:
    namespace: openshift-gitops-operator
    operatorgroup: openshift-gitops-operator-group
    subscription: openshift-gitops-operator
    extra_resources: []

# MTV CRD kinds to clean (in dependency order)
ocp_cleanup_mtv_crd_kinds:
  - kind: Migration
    api_version: forklift.konveyor.io/v1beta1
  - kind: Plan
    api_version: forklift.konveyor.io/v1beta1
  - kind: NetworkMap
    api_version: forklift.konveyor.io/v1beta1
  - kind: StorageMap
    api_version: forklift.konveyor.io/v1beta1
  - kind: Provider
    api_version: forklift.konveyor.io/v1beta1

# Target namespaces for migrated VMs
ocp_cleanup_target_namespaces: []

# Wait/retry settings
ocp_cleanup_wait_retries: 60
ocp_cleanup_wait_delay: 10
...
