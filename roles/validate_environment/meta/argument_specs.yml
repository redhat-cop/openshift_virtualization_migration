---
argument_specs:
  main:
    short_description: >-
      Validate the migration environment before seeding AAP
    description:
      - >-
        Runs the selected validate_environment checks and reports a summary,
        then fails the play if any ran check failed. Checks: OpenShift
        API auth, CNV and MTV operator health, AAP access, vCenter
        connectivity, and VDDK init image configuration.
      - >-
        Designed to run from an AAP job template (credentials inject
        K8S_AUTH_*, VMWARE_*, CONTROLLER_HOST, CONTROLLER_API_TOKEN) or
        a controller with the sample inventory. Connection variables
        cascade from environment variables to inventory host variables.
      - >-
        All checks run by default; validate_environment_checks limits the
        pass to the named checks. An unconfigured target fails
        that check with guidance rather than crashing the play, so one
        run reports everything that needs attention.
    options:
      validate_environment_checks:
        type: list
        elements: str
        required: false
        default:
          - openshift
          - cnv
          - mtv
          - aap
          - vcenter
          - vddk
        description: >-
          Which environment validation checks to run, as check-name
          strings (openshift, cnv, mtv, aap, vcenter, vddk). Defaults to
          all six. Accepts a list, a bare check name, or a bracketed
          comma-separated string — the CLI -e form, e.g.
          -e validate_environment_checks=[vcenter] to debug a single
          check. An unknown name fails the include with a loud
          file-not-found error — the summary report still runs.

      validate_environment_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Whether to enable secure logging for tasks that handle
          credentials. Set to false to debug failed probes. Prefer a
          one-off CLI run (-e validate_environment_secure_logging=false)
          over flipping the toggle on a job template; if you must,
          rotate the exposed credential (token or password) afterwards.

      validate_environment_target_name:
        type: str
        required: false
        description: >-
          Inventory host whose variables feed the OpenShift checks.
          Defaults to the target_name extra var (injected by the seeded
          credentials) or the first migration_clusters host.

      validate_environment_source_name:
        type: str
        required: false
        description: >-
          Inventory host whose variables feed the vCenter and VDDK
          checks. Defaults to the source_name extra var (injected by the
          seeded credentials) or the first vm_sources host.

      validate_environment_aap_name:
        type: str
        required: false
        description: >-
          Inventory host whose aap_* variables feed the AAP check.
          Defaults to the first migration_aap host.

      validate_environment_openshift_host:
        type: str
        required: false
        default: ""
        description: >-
          OpenShift API endpoint. Resolves from K8S_AUTH_HOST env var or
          the openshift_host variable on the target cluster host
          (validate_environment_target_name). Required — the validate_environment aborts
          without it.

      validate_environment_openshift_api_key:
        type: str
        required: false
        default: ""
        no_log: true
        description: >-
          OpenShift API token. Resolves from K8S_AUTH_API_KEY env var or
          the openshift_api_key variable on the target cluster host
          (validate_environment_target_name). Required — the validate_environment aborts
          without it.

      validate_environment_openshift_verify_ssl:
        type: bool
        required: false
        default: true
        description: >-
          Validate the OpenShift API TLS certificate.

      validate_environment_vcenter_hostname:
        type: str
        required: false
        default: ""
        description: >-
          vCenter endpoint for the connectivity check. Resolves from
          VMWARE_HOST env var or the host variable on the source host
          (validate_environment_source_name). The check applies to vmware sources;
          other source types skip it. When unset, the vCenter check fails
          with instructions.

      validate_environment_vcenter_username:
        type: str
        required: false
        default: ""
        description: >-
          vCenter username. Resolves from VMWARE_USER env var or the
          username variable on the source host (validate_environment_source_name).

      validate_environment_vcenter_password:
        type: str
        required: false
        default: ""
        no_log: true
        description: >-
          vCenter password. Resolves from VMWARE_PASSWORD env var or the
          password variable on the source host (validate_environment_source_name).

      validate_environment_vcenter_validate_certs:
        type: bool
        required: false
        default: true
        description: >-
          Validate the vCenter TLS certificate.

      validate_environment_aap_hostname:
        type: str
        required: false
        default: ""
        description: >-
          AAP controller URL for the access check. Resolves from
          AAP_HOSTNAME env var, the CONTROLLER_HOST env var injected by
          the controller for its own jobs, or the aap_hostname variable
          on the AAP host (validate_environment_aap_name). When unset, the AAP check
          fails with instructions.

      validate_environment_aap_api_path:
        type: str
        required: false
        default: /api/controller/v2/
        description: >-
          API base path for the access check. Defaults to
          /api/controller/v2/ (AAP 2.5 platform deployments); AWX and
          AAP 2.4 and earlier serve the controller API at /api/v2/ —
          set that value for those environments.

      validate_environment_aap_username:
        type: str
        required: false
        default: ""
        description: >-
          AAP username for the access check.

      validate_environment_aap_password:
        type: str
        required: false
        default: ""
        no_log: true
        description: >-
          AAP password for the access check when no token is set.

      validate_environment_aap_token:
        type: str
        required: false
        default: ""
        no_log: true
        description: >-
          AAP OAuth2 token. Resolves from AAP_TOKEN env var, the
          CONTROLLER_API_TOKEN env var injected by the controller for its
          own jobs, or the aap_token variable on the AAP host. Takes
          precedence over username/password.

      validate_environment_aap_validate_certs:
        type: bool
        required: false
        default: true
        description: >-
          Validate the AAP TLS certificate.

      validate_environment_cnv_namespace:
        type: str
        required: false
        default: openshift-cnv
        description: >-
          Namespace holding the OpenShift Virtualization operator CSV.

      validate_environment_mtv_namespace:
        type: str
        required: false
        default: openshift-mtv
        description: >-
          Namespace holding the MTV operator CSV. Resolves from the
          mtv_namespace inventory variable by default.

      validate_environment_vddk_image:
        type: str
        required: false
        default: ""
        description: >-
          VDDK init image for direct-source migrations. Resolves from the
          source host's vddk.image dictionary entry or the vddk_image
          variable. The check enforces a scheme-less reference.
...
