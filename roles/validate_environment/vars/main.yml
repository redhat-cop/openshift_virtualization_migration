---
# Internal derived values — not user-facing. Users set the source host's
# type in the inventory; this resolves it for the vCenter and VDDK gates.
__validate_environment_source_type: "{{ hostvars[validate_environment_source_name]['type'] | default('', true) }}"

# Internal: the source host's vddk dictionary (empty when the host or the
# vddk entry is absent).
__validate_environment_source_vddk: "{{ hostvars[validate_environment_source_name]['vddk'] | default({}, true) }}"
...
