---
# Collect every check result and fail the play if any ran check failed.
# Check files register __validate_environment_result_* facts with ran: true; the
# summary assert only covers checks that ran. A check that never ran
# (unexpected failure in a full run) still shows FAIL with "check did
# not run" in the summary, so the report never lies.
#
# The record tasks' passed values round-trip as real booleans on
# ansible-core 2.16 (a full-string-expression set_fact preserves the
# native type, verified), and the un-run defaults carry real false
# booleans. Check outputs still produce mixed forms, so the | bool
# filter accepts both. Note: the bare `falsy` test does NOT convert
# the string "False" — pass convert_bool=true
# (selectattr(..., 'falsy', true)) when filtering summary values by
# key, as the fail_msg does.

- name: report | Build the validate_environment summary
  ansible.builtin.set_fact:
    __validate_environment_summary:
      OpenShift API auth: >-
        {{ __validate_environment_result_openshift
           | default({'ran': false, 'passed': false, 'detail': 'check did not run'}) }}
      OpenShift Virtualization operator: >-
        {{ __validate_environment_result_cnv
           | default({'ran': false, 'passed': false, 'detail': 'check did not run'}) }}
      MTV operator: >-
        {{ __validate_environment_result_mtv
           | default({'ran': false, 'passed': false, 'detail': 'check did not run'}) }}
      AAP access: >-
        {{ __validate_environment_result_aap
           | default({'ran': false, 'passed': false, 'detail': 'check did not run'}) }}
      vCenter connectivity: >-
        {{ __validate_environment_result_vcenter
           | default({'ran': false, 'passed': false, 'detail': 'check did not run'}) }}
      VDDK init image: >-
        {{ __validate_environment_result_vddk
           | default({'ran': false, 'passed': false, 'detail': 'check did not run'}) }}

- name: report | Display the validate_environment summary
  ansible.builtin.debug:
    msg: >-
      {{ __validate_environment_check.value.passed | bool | ternary('PASS', 'FAIL') }} |
      {{ __validate_environment_check.key }}: {{ __validate_environment_check.value.detail }}
  loop: "{{ __validate_environment_summary | dict2items }}"
  loop_control:
    loop_var: __validate_environment_check
    label: "{{ __validate_environment_check.key }}"

- name: report | Assert every ran validate_environment check passed
  ansible.builtin.assert:
    that:
      - >-
        __validate_environment_summary | dict2items
        | selectattr('value.ran', 'equalto', true)
        | map(attribute='value.passed')
        | map('bool')
        | select('equalto', false)
        | list | length == 0
    fail_msg: >-
      Environment validation FAILED:
      {{ __validate_environment_summary | dict2items
         | selectattr('value.ran', 'equalto', true)
         | selectattr('value.passed', 'falsy', true)
         | map(attribute='key') | join(', ') }}.
      Fix each failed check before seeding — do not seed to paper over a
      missing operator.
    success_msg: >-
      Environment validation passed: all
      {{ __validate_environment_summary | dict2items
         | selectattr('value.ran', 'equalto', true) | list | length }}
      checks green. The environment is ready to seed.
    quiet: true

- name: report | Remind the operator to rotate credentials exposed in debug output
  ansible.builtin.debug:
    msg: >-
      validate_environment_secure_logging is false — task parameters and API responses
      were printed to job output. If this ran on a persistent AAP job
      template, rotate the exposed credentials now: the OpenShift API key
      (K8S_AUTH_API_KEY), the AAP token (AAP_TOKEN or
      CONTROLLER_API_TOKEN), and the vCenter password (VMWARE_PASSWORD).
  when: not (validate_environment_secure_logging | default(true) | bool)
...
