---
# Query the ClusterServiceVersion list in the CNV namespace.
# kubernetes.core.k8s_info is certified content and the collection's
# established pattern for cluster queries.

- name: validate_cnv | List ClusterServiceVersions in the CNV namespace
  kubernetes.core.k8s_info:
    host: "{{ validate_environment_openshift_host }}"
    api_key: "{{ validate_environment_openshift_api_key }}"
    validate_certs: "{{ validate_environment_openshift_verify_ssl }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ validate_environment_cnv_namespace }}"
  register: __validate_environment_cnv_csvs
  failed_when: false
  # A module crash (e.g. an unresolvable host or a malformed kubeconfig)
  # bypasses failed_when and would abort the run; the record task below
  # turns the fault into a graceful check result.
  ignore_errors: true
  no_log: "{{ validate_environment_secure_logging }}"

- name: validate_cnv | Find the OpenShift Virtualization CSV
  ansible.builtin.set_fact:
    __validate_environment_cnv_found: >-
      {{ __validate_environment_cnv_csvs.resources | default([])
      | selectattr('metadata.name', 'search', 'kubevirt-hyperconverged')
      | list | length > 0 }}
    __validate_environment_cnv_csv: >-
      {{ __validate_environment_cnv_csvs.resources | default([])
      | selectattr('metadata.name', 'search', 'kubevirt-hyperconverged')
      | list | first | default({}) }}

- name: validate_cnv | Record the OpenShift Virtualization operator check result
  ansible.builtin.set_fact:
    __validate_environment_result_cnv:
      ran: true
      passed: "{{ __validate_environment_cnv_found
        and (__validate_environment_cnv_csv.status.phase | default('')) == 'Succeeded' }}"
      detail: >-
        {% if __validate_environment_cnv_csvs.resources is not defined %}
        Cluster API query failed in {{ validate_environment_cnv_namespace }} —
        check the OpenShift connection and credentials first; the
        operator check is inconclusive when the API is unreachable
        {% elif not __validate_environment_cnv_found %}
        No kubevirt-hyperconverged CSV found in
        {{ validate_environment_cnv_namespace }} — install the OpenShift
        Virtualization operator before seeding
        {% elif (__validate_environment_cnv_csv.status.phase | default('')) != 'Succeeded' %}
        CSV {{ __validate_environment_cnv_csv.metadata.name }} in
        {{ validate_environment_cnv_namespace }} is
        {{ __validate_environment_cnv_csv.status.phase | default('unknown') }} —
        expected Succeeded
        {% else %}
        CSV {{ __validate_environment_cnv_csv.metadata.name }} Succeeded in
        {{ validate_environment_cnv_namespace }}
        {% endif %}
...
