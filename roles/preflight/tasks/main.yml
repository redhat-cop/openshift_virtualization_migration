---
# Preflight validates the migration environment before seeding AAP.
#
# All checks run on every invocation; the summary report (always-tagged)
# fails the play if any ran check failed, so one run reports everything
# that needs attention. The summary asserts only over the checks that
# ran, so an isolated --tags debug run ends green when the targeted
# check passed. Checks whose target is not configured fail that check
# with a message describing what to set — they do not crash the play.

- name: Include pre-validation of required connection variables
  ansible.builtin.include_tasks:
    file: pre_validate.yml
    apply:
      tags:
        - always
  tags:
    - always

- name: Run preflight checks
  block:
    - name: Include OpenShift API authentication check
      ansible.builtin.include_tasks:
        file: validate_openshift.yml
        apply:
          tags:
            - openshift
            - validate
      tags:
        - openshift
        - validate

    - name: Include OpenShift Virtualization operator check
      ansible.builtin.include_tasks:
        file: validate_cnv.yml
        apply:
          tags:
            - cnv
            - validate
      tags:
        - cnv
        - validate

    - name: Include MTV operator check
      ansible.builtin.include_tasks:
        file: validate_mtv.yml
        apply:
          tags:
            - mtv
            - validate
      tags:
        - mtv
        - validate

    - name: Include AAP access check
      ansible.builtin.include_tasks:
        file: validate_aap.yml
        apply:
          tags:
            - aap
            - validate
      tags:
        - aap
        - validate

    - name: Include vCenter connectivity check
      ansible.builtin.include_tasks:
        file: validate_vcenter.yml
        apply:
          tags:
            - vcenter
            - validate
      tags:
        - vcenter
        - validate

    - name: Include VDDK init image check
      ansible.builtin.include_tasks:
        file: validate_vddk.yml
        apply:
          tags:
            - vddk
            - validate
      tags:
        - vddk
        - validate

  always:
    - name: Include the preflight summary report
      ansible.builtin.include_tasks:
        file: report.yml
        apply:
          tags:
            - always
      tags:
        - always
...
