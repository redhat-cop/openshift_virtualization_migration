---
# Probe the OpenShift API with the configured credential.
# ansible.builtin.uri is used instead of the k8s modules because the HTTP
# status code cleanly distinguishes 401/403 (credential rejected) from
# 200/201 (authenticated).

- name: validate_openshift | Probe OpenShift API SelfSubjectReview with the configured credential
  ansible.builtin.uri:
    url: "{{ preflight_openshift_host }}/apis/authentication.k8s.io/v1/selfsubjectreviews"
    method: POST
    body: '{"apiVersion":"authentication.k8s.io/v1","kind":"SelfSubjectReview"}'
    body_format: json
    validate_certs: "{{ preflight_openshift_verify_ssl }}"
    headers:
      Authorization: "{{ 'Bearer ' ~ (preflight_openshift_api_key | trim) }}"
    status_code: [200, 201, 401, 403]
  register: __preflight_ocp
  # No module state is created — the review object is informational only,
  # so this probe must never report changed.
  changed_when: false
  failed_when: false
  no_log: "{{ preflight_secure_logging }}"

- name: validate_openshift | Record the OpenShift authentication check result
  ansible.builtin.set_fact:
    __preflight_result_openshift:
      ran: true
      passed: "{{ (__preflight_ocp.status | default(0)) in [200, 201] }}"
      detail: >-
        {% if (__preflight_ocp.status | default(0)) in [200, 201] %}
        HTTP {{ __preflight_ocp.status }} at {{ preflight_openshift_host }}
        (identity: {{ __preflight_ocp.json.status.userInfo.username | default('unknown', true) }})
        {% else %}
        HTTP {{ __preflight_ocp.status | default('connection error') }} at
        {{ preflight_openshift_host }} — 401/403 means the token or
        credential is missing, expired, or rejected
        {% endif %}
...
