---
# Query the ClusterServiceVersion list in the CNV namespace.
# kubernetes.core.k8s_info is certified content and the collection's
# established pattern for cluster queries.

- name: validate_cnv | List ClusterServiceVersions in the CNV namespace
  kubernetes.core.k8s_info:
    host: "{{ preflight_openshift_host }}"
    api_key: "{{ preflight_openshift_api_key }}"
    validate_certs: "{{ preflight_openshift_verify_ssl }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ preflight_cnv_namespace }}"
  register: __preflight_cnv_csvs
  failed_when: false
  no_log: "{{ preflight_secure_logging }}"

- name: validate_cnv | Find the OpenShift Virtualization CSV
  ansible.builtin.set_fact:
    __preflight_cnv_found: >-
      {{ __preflight_cnv_csvs.resources | default([])
      | selectattr('metadata.name', 'search', 'kubevirt-hyperconverged')
      | list | length > 0 }}
    __preflight_cnv_csv: >-
      {{ __preflight_cnv_csvs.resources | default([])
      | selectattr('metadata.name', 'search', 'kubevirt-hyperconverged')
      | list | first | default({}) }}

- name: validate_cnv | Record the OpenShift Virtualization operator check result
  ansible.builtin.set_fact:
    __preflight_result_cnv:
      ran: true
      passed: "{{ __preflight_cnv_found
        and (__preflight_cnv_csv.status.phase | default('')) == 'Succeeded' }}"
      detail: >-
        {% if __preflight_cnv_csvs.resources is not defined %}
        Cluster API query failed in {{ preflight_cnv_namespace }} —
        check the OpenShift connection and credentials first; the
        operator check is inconclusive when the API is unreachable
        {% elif not __preflight_cnv_found %}
        No kubevirt-hyperconverged CSV found in
        {{ preflight_cnv_namespace }} — install the OpenShift
        Virtualization operator before seeding
        {% elif (__preflight_cnv_csv.status.phase | default('')) != 'Succeeded' %}
        CSV {{ __preflight_cnv_csv.metadata.name }} in
        {{ preflight_cnv_namespace }} is
        {{ __preflight_cnv_csv.status.phase | default('unknown') }} —
        expected Succeeded
        {% else %}
        CSV {{ __preflight_cnv_csv.metadata.name }} Succeeded in
        {{ preflight_cnv_namespace }}
        {% endif %}
...
