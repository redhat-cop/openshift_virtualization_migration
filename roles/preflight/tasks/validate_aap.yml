---
# Probe the AAP API with the configured account.
# ansible.builtin.uri is used instead of ansible.controller modules because
# the preflight runs before seeding and needs only a lightweight auth probe
# (/api/v2/me/ returns the authenticated account); controller modules pull
# in full controller configuration context that does not exist yet.

- name: validate_aap | Probe AAP API with the configured account
  when: preflight_aap_hostname | length > 0
  ansible.builtin.uri:
    url: "{{ preflight_aap_hostname }}/api/v2/me/"
    method: GET
    validate_certs: "{{ preflight_aap_validate_certs }}"
    headers:
      Authorization: >-
        {{
          ('Bearer ' ~ (preflight_aap_token | trim))
          if preflight_aap_token | length > 0
          else ('Basic ' ~ ((preflight_aap_username ~ ':' ~ preflight_aap_password) | b64encode))
        }}
    status_code: [200, 401, 403]
  register: __preflight_aap
  failed_when: false
  no_log: "{{ preflight_secure_logging }}"

- name: validate_aap | Record the AAP access check result
  ansible.builtin.set_fact:
    __preflight_result_aap:
      ran: true
      passed: "{{ (preflight_aap_hostname | length > 0) and ((__preflight_aap.status | default(0)) == 200) }}"
      detail: >-
        {% if preflight_aap_hostname | length == 0 %}
        Not configured — set aap_hostname in the inventory (or AAP_HOSTNAME)
        to enable the AAP access check
        {% elif (__preflight_aap.status | default(0)) == 200 %}
        HTTP 200 at {{ preflight_aap_hostname }} (authenticated as
        {{ __preflight_aap.json.results[0].username | default('unknown', true) }})
        {% else %}
        HTTP {{ __preflight_aap.status | default('connection error') }} at
        {{ preflight_aap_hostname }} — 401/403 means the account or token is
        wrong or expired
        {% endif %}
...
