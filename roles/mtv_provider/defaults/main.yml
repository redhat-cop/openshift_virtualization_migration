---
mtv_provider_secure_logging: "{{ secure_logging | default(true) }}"

# ---------------------------------------------------------------------------
# Provider configuration — controls how MTV providers are created
# ---------------------------------------------------------------------------

# Namespace where the provider will be created.
# Resolved from target host vars in AAP inventory; override if needed.
mtv_provider_provider_namespace: >-
  {{ hostvars[target_name]['mtv_namespace'] | default('openshift-mtv') }}

# Whether to wait for the Provider CR to reach Ready status after creation.
mtv_provider_provider_wait: true

# Seconds to wait for the Provider to become Ready before failing.
mtv_provider_provider_wait_timeout: 120

# Seconds between status polls while waiting for Ready.
mtv_provider_provider_wait_poll: 10

# Desired state of the provider — present or absent.
mtv_provider_provider_state: present

# Forklift API version for Provider CRs.
mtv_provider_api_version: forklift.konveyor.io/v1beta1

# Override configuration merged into the Provider CR spec.
mtv_provider_provider_override: {}

# Whether to automatically retrieve the source TLS certificate
# when insecureSkipTlsVerify is false and no certificate is provided.
mtv_provider_auto_retrieve_cert: true

# ---------------------------------------------------------------------------
# Source metadata — resolved from AAP inventory host vars
# ---------------------------------------------------------------------------
mtv_provider_source_type: >-
  {{ hostvars[source_name]['type'] | default('vmware') }}

mtv_provider_source_host: >-
  {{ hostvars[source_name]['host'] }}

mtv_provider_source_sdk_endpoint: >-
  {{ hostvars[source_name]['sdk_endpoint'] | default('/sdk') }}

mtv_provider_source_vddk: "{{ hostvars[source_name]['vddk'] | default({}) }}"
...
