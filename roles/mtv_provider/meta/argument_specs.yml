---
argument_specs:
  main:
    short_description: >-
      Create MTV/Forklift source provider CRs on OpenShift target clusters
    description:
      - >-
        Creates a Forklift Provider custom resource and its backing Secret
        on a target OpenShift cluster for a given source environment.
      - >-
        Designed to run from AAP with credential injection. The source
        credential injects VMWARE_* environment variables and
        C(source_name) as an extra var. OpenShift connection is
        provided by the AAP target credential which sets K8S_AUTH_*
        environment variables and C(target_name) as an extra var.
      - >-
        For targets with multiple sources, launch the job template once
        per source-target pair.
    options:
      source_name:
        type: str
        required: true
        description: >-
          Name of the source environment (must match an AAP inventory host
          in the vm_sources group).

      target_name:
        type: str
        required: true
        description: >-
          Name of the target OpenShift cluster (must match an AAP inventory
          host in the migration_clusters group).

      mtv_provider_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Whether to enable secure logging for sensitive tasks.

      mtv_provider_provider_namespace:
        type: str
        required: false
        default: openshift-mtv
        description: >-
          Namespace where the provider will be created.
          Resolved from the target host's mtv_namespace variable by default.

      mtv_provider_provider_wait:
        type: bool
        required: false
        default: true
        description: >-
          Whether to wait for the Provider CR to reach Ready status after
          creation.

      mtv_provider_provider_wait_timeout:
        type: int
        required: false
        default: 120
        description: >-
          Seconds to wait for the Provider to become Ready before failing.

      mtv_provider_provider_wait_poll:
        type: int
        required: false
        default: 10
        description: >-
          Seconds between status polls while waiting for Ready.

      mtv_provider_provider_state:
        type: str
        required: false
        default: present
        choices:
          - present
          - absent
        description: >-
          Desired state of the provider. Set to absent to remove a
          previously created provider and its secret.

      mtv_provider_api_version:
        type: str
        required: false
        default: forklift.konveyor.io/v1beta1
        description: >-
          Forklift API version for Provider CRs.

      mtv_provider_provider_override:
        type: dict
        required: false
        default: {}
        description: >-
          Override configuration merged into the Provider CR spec.
          Allows setting additional properties such as settings or
          other fields that evolve with the Forklift API.

      mtv_provider_auto_retrieve_cert:
        type: bool
        required: false
        default: true
        description: >-
          Whether to automatically retrieve the source TLS certificate
          when verify_ssl is true and no certificate is provided.

      mtv_provider_source_username:
        type: str
        required: true
        description: >-
          Username for the source hypervisor. Cascades from
          C(VMWARE_USER) env var or C(mf_source_username).

      mtv_provider_source_password:
        type: str
        required: true
        no_log: true
        description: >-
          Password for the source hypervisor. Cascades from
          C(VMWARE_PASSWORD) env var or C(mf_source_password).

      mtv_provider_source_certificate:
        type: str
        required: false
        default: ""
        description: >-
          TLS CA certificate for the source hypervisor. Cascades
          from C(VMWARE_CA_CERT) env var or
          C(mf_source_certificate).

      mtv_provider_source_verify_ssl:
        type: bool
        required: false
        default: true
        description: >-
          Whether to verify TLS certificates for the source
          hypervisor. Cascades from C(VMWARE_VALIDATE_CERTS)
          env var; falls back to the inverse of
          C(mf_insecure_skip_tls_verify) if set, or C(true).

      mtv_provider_managed_by_label:
        type: str
        required: false
        default: ansible-migration-factory
        description: >-
          Value of the app.kubernetes.io/managed-by label
          applied to Provider and Secret CRs.
...
