---

# title: AAP Credentials Secret
# required: True
# description: Name of the Secret containing AAP credentials.
mtv_hook_invoke_aap_credentials_secret: "mtv-aap-credentials"

# title: AAP Credentials Secret Namespace
# required: False
# description: Namespace of the Secret containing AAP credentials.
mtv_hook_invoke_aap_credentials_secret_namespace: ""

# title: AAP Organization
# required: False
# description: Name of the AAP organization.
mtv_hook_invoke_aap_organization: "Default"

# title: AAP Job Template
# required: True
# description: Name of the AAP job template.
mtv_hook_invoke_aap_job_template: ""

# title: AAP Job Template Extra Vars
# required: False
# description: Extra variables for the AAP job template.
mtv_hook_invoke_aap_job_template_extra_vars: {}

# title: Secure Logging
# required: False
# description: Whether to enable secure logging.
mtv_hook_invoke_aap_secure_logging: "{{ secure_logging | default(true) }}"

# title: AAP Job Template Wait
# required: False
# description: Whether to wait for the AAP job template to complete.
mtv_hook_invoke_aap_job_template_wait: true

# title: Workload File
# required: False
# description: Location of the workload file.
mtv_hook_invoke_aap_workload_file: workload.yml

# title: Plan File
# required: False
# description: Location of the plan file.
mtv_hook_invoke_aap_plan_file: plan.yml

# title: Workload variable name
# required: False
# description: Name of the variable associated with the workload variable file.
mtv_hook_invoke_aap_workload_var: workload

# title: Plan variable name
# required: False
# description: Name of the variable associated with the plan variable file.
mtv_hook_invoke_aap_plan_var: plan
...
