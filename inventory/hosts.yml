---
# OpenShift Virtualization Migration Factory v2 — Inventory
#
# This inventory mirrors the AAP inventory structure that aap_seed creates.
# Sources and targets are logical hosts (not SSH targets) — all playbooks
# run on localhost with connection: local.
#
# Sensitive values (passwords, tokens, certificates) should be placed in
# inventory.vault.yml and encrypted with Ansible Vault. See
# inventory.vault.yml.example for the template.
#
# AAP Mapping:
#   - Each host under "sources" becomes an AAP inventory host in the
#     "sources" group + a "Migration Factory - Source Environment" credential
#   - Each host under "targets" becomes an AAP inventory host in the
#     "targets" group + a "Migration Factory - Target Cluster" credential

all:
  vars:
    # -------------------------------------------------------------------------
    # AAP Connection
    # -------------------------------------------------------------------------
    # Required when running playbooks locally (outside AAP).
    # When running inside AAP, these are provided by the controller.
    controller_host: ""
    controller_username: admin
    controller_password: "{{ vault_controller_password | default('') }}"
    # controller_token: ""
    controller_validate_certs: false

    # -------------------------------------------------------------------------
    # AAP Content Configuration
    # -------------------------------------------------------------------------
    aap_org_name: Migration Factory
    aap_project_repo: ""
    aap_project_branch: main

    # Execution Environment
    aap_execution_environment: OpenShift Virtualization Migration
    aap_execution_environment_image: ""

    # Container registry for EE image
    container_host: ""
    container_username: "{{ vault_container_username | default('') }}"
    container_password: "{{ vault_container_password | default('') }}"
    container_verify_ssl: false

    # -------------------------------------------------------------------------
    # Git Credentials
    # -------------------------------------------------------------------------
    git_credential_name: Git
    git_username: "{{ vault_git_username | default('') }}"
    git_password: "{{ vault_git_password | default('') }}"
    # git_ssh_private_key: "{{ vault_git_ssh_private_key | default('') }}"
    # git_ssh_key_passphrase: "{{ vault_git_ssh_key_passphrase | default('') }}"

    # -------------------------------------------------------------------------
    # Automation Hub
    # -------------------------------------------------------------------------
    automation_hub_certified_url: https://cloud.redhat.com/api/automation-hub/content/published/
    automation_hub_certified_auth_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    automation_hub_certified_token: "{{ vault_automation_hub_certified_token | default('') }}"

    automation_hub_validated_url: https://cloud.redhat.com/api/automation-hub/content/validated/
    automation_hub_validated_auth_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    automation_hub_validated_token: "{{ vault_automation_hub_validated_token | default('') }}"

  children:
    # =========================================================================
    # Source Environments (vSphere, RHV)
    # =========================================================================
    # Each host represents a source hypervisor environment.
    # Non-secret metadata is stored as host vars.
    # Secrets (username, password, certificate) are stored in vault and
    # pushed to AAP as "Migration Factory - Source Environment" credentials.
    sources:
      hosts:

        # -- Example: VMware vSphere source ----------------------------------
        # vcenter-prod:
        #   mf_env_type: vmware
        #   mf_env_host: vcenter.prod.example.com
        #   mf_sdk_endpoint: /sdk
        #   mf_insecure_skip_tls_verify: true
        #   mf_vddk_image: registry.example.com/vddk:8.0
        #   mf_esxi_hosts: []
        #   # Secrets — reference vault variables
        #   mf_source_username: "{{ vault_vcenter_prod_username }}"
        #   mf_source_password: "{{ vault_vcenter_prod_password }}"
        #   mf_source_certificate: "{{ vault_vcenter_prod_certificate | default('') }}"

        # -- Example: VMware vSphere with ESXi direct mode --------------------
        # vcenter-lab:
        #   mf_env_type: vmware
        #   mf_env_host: vcenter.lab.example.com
        #   mf_sdk_endpoint: /sdk
        #   mf_insecure_skip_tls_verify: true
        #   mf_vddk_image: registry.example.com/vddk:8.0
        #   mf_esxi_hosts:
        #     - id: host-1
        #       ip: 10.0.1.10
        #       user: root
        #       password: "{{ vault_esxi_host1_password }}"
        #     - id: host-2
        #       ip: 10.0.1.11
        #       user: root
        #       password: "{{ vault_esxi_host2_password }}"
        #   mf_source_username: "{{ vault_vcenter_lab_username }}"
        #   mf_source_password: "{{ vault_vcenter_lab_password }}"
        #   mf_source_certificate: ""

        # -- Example: Red Hat Virtualization (RHV) source (Phase 2) -----------
        # rhv-legacy:
        #   mf_env_type: ovirt
        #   mf_env_host: rhvm.example.com
        #   mf_sdk_endpoint: /ovirt-engine/api
        #   mf_insecure_skip_tls_verify: true
        #   mf_source_username: "{{ vault_rhv_username }}"
        #   mf_source_password: "{{ vault_rhv_password }}"
        #   mf_source_certificate: ""

    # =========================================================================
    # Target OpenShift Clusters
    # =========================================================================
    # Each host represents a target OpenShift cluster where VMs will be
    # migrated to. Non-secret metadata is stored as host vars.
    # Secrets (api_key) are stored in vault and pushed to AAP as
    # "Migration Factory - Target Cluster" credentials.
    targets:
      hosts:

        # -- Example: Production OpenShift cluster ----------------------------
        # ocp-prod:
        #   mf_env_host: https://api.ocp-prod.example.com:6443
        #   mf_verify_ssl: false
        #   mf_mtv_namespace: openshift-mtv
        #   mf_default_target_namespace: vm-workloads
        #   mf_operators:
        #     - mtv
        #     - cnv
        #     - nmstate
        #   # Secret — reference vault variable
        #   mf_target_api_key: "{{ vault_ocp_prod_api_key }}"

        # -- Example: Staging OpenShift cluster -------------------------------
        # ocp-staging:
        #   mf_env_host: https://api.ocp-staging.example.com:6443
        #   mf_verify_ssl: false
        #   mf_mtv_namespace: openshift-mtv
        #   mf_default_target_namespace: vm-staging
        #   mf_operators:
        #     - mtv
        #     - cnv
        #     - nmstate
        #     - oadp
        #   mf_target_api_key: "{{ vault_ocp_staging_api_key }}"

...
