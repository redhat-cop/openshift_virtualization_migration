---
- name: Test ocp_cleanup role variable defaults
  block:
    - name: Verify role defaults are loadable
      ansible.builtin.include_vars:
        file: "{{ role_path }}/../../roles/ocp_cleanup/defaults/main.yml"

    - name: Confirm MTV cleanup toggles default to true
      ansible.builtin.assert:
        that:
          - ocp_cleanup_mtv_migrations_remove | bool
          - ocp_cleanup_mtv_plans_remove | bool
          - ocp_cleanup_mtv_maps_remove | bool
          - ocp_cleanup_mtv_providers_remove | bool
          - ocp_cleanup_mtv_secrets_remove | bool

    - name: Confirm destructive toggles default to false
      ansible.builtin.assert:
        that:
          - not (ocp_cleanup_migrated_vms_remove | bool)
          - not (ocp_cleanup_target_namespaces_remove | bool)
          - not (ocp_cleanup_operators_remove | bool)
          - not (ocp_cleanup_dry_run | bool)

    - name: Confirm MTV CRD kinds list is populated
      ansible.builtin.assert:
        that:
          - ocp_cleanup_mtv_crd_kinds | length == 5
          - ocp_cleanup_mtv_crd_kinds[0].kind == 'Migration'
          - ocp_cleanup_mtv_crd_kinds[4].kind == 'Provider'

    - name: Confirm operator definitions are complete
      ansible.builtin.assert:
        that:
          - ocp_cleanup_operator_definitions.mtv is defined
          - ocp_cleanup_operator_definitions.cnv is defined
          - ocp_cleanup_operator_definitions.mtv.namespace == 'openshift-mtv'
          - ocp_cleanup_operators | length == 8
...
