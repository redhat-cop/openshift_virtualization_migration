---
- name: Test aap_cleanup role variable defaults
  block:
    - name: Verify role defaults are loadable
      ansible.builtin.include_vars:
        file: "{{ role_path }}/../../roles/aap_cleanup/defaults/main.yml"

    - name: Confirm cleanup scope toggles default to true
      ansible.builtin.assert:
        that:
          - aap_cleanup_workflows_remove | bool
          - aap_cleanup_job_templates_remove | bool
          - aap_cleanup_credentials_remove | bool
          - aap_cleanup_inventories_remove | bool
          - aap_cleanup_projects_remove | bool

    - name: Confirm destructive toggles default to false
      ansible.builtin.assert:
        that:
          - not (aap_cleanup_organization_remove | bool)
          - not (aap_cleanup_job_history_purge | bool)
          - not (aap_cleanup_dry_run | bool)
...
