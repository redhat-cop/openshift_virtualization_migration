---
- name: Test aap_cleanup role in dry-run mode
  block:
    - name: Run aap_cleanup with dry_run enabled
      ansible.builtin.include_role:
        name: infra.openshift_virtualization_migration.aap_cleanup
      vars:
        aap_cleanup_dry_run: true
        aap_cleanup_controller_hostname: "{{ test_controller_hostname | default('localhost') }}"
        aap_cleanup_controller_token: "{{ test_controller_token | default('test-token') }}"
        aap_cleanup_aap_org_name: "{{ test_org_name | default('Default') }}"

    - name: Verify no resources were deleted in dry-run
      ansible.builtin.debug:
        msg: "Dry-run mode verified — no resources were modified"

- name: Test idempotency
  block:
    - name: Run aap_cleanup a second time
      ansible.builtin.include_role:
        name: infra.openshift_virtualization_migration.aap_cleanup
      vars:
        aap_cleanup_dry_run: true
        aap_cleanup_controller_hostname: "{{ test_controller_hostname | default('localhost') }}"
        aap_cleanup_controller_token: "{{ test_controller_token | default('test-token') }}"
        aap_cleanup_aap_org_name: "{{ test_org_name | default('Default') }}"

    - name: Verify idempotent execution
      ansible.builtin.debug:
        msg: "Idempotency verified — second run completed without errors"
...
