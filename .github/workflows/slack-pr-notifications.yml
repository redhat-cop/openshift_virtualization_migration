name: Slack PR Notifications

# ============================================================================
# WORKFLOW: SLACK PR NOTIFICATIONS
# ============================================================================
#
# Sends Slack notifications for PR lifecycle events (opened, closed, merged,
# review submitted). This is an informational workflow — it is NOT a required
# quality gate and does NOT block PR merges.
#
# FAILURE HANDLING:
# -----------------
# The Slack send step uses continue-on-error: true so that transient failures
# (expired webhook URL, Slack outage, etc.) do not surface as a red ✗ status
# that could be mistaken for a code quality issue. On failure, a warning step
# logs a clear message with actionable guidance for maintainers.
#
# ============================================================================

on:
  pull_request_target:
    types: [opened, closed, reopened]
    branches: ["main", "v2"]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'pull_request_target' }}
    steps:
      - name: Set notification details
        id: details
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_USER_LOGIN: ${{ github.event.review.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            STATE="$REVIEW_STATE"
            # Skip comment-only reviews
            if [[ -z "$STATE" ]]; then
              echo "Skipping notification for comment-only review"
              exit 0
            fi
            TITLE="PR Review: ${STATE} - ${PR_TITLE}"
            COLOR=$([[ "$STATE" == "approved" ]] && echo "good" || echo "warning")
            BODY="${REVIEW_USER_LOGIN} ${STATE} the PR"
          else
            ACTION="$EVENT_ACTION"
            TITLE="PR ${ACTION^}: ${PR_TITLE}"
            if [[ "$ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
              TITLE="PR Merged: ${PR_TITLE}"
              COLOR="good"
            elif [[ "$ACTION" == "opened" ]]; then
              COLOR="#1a73e8"
            elif [[ "$ACTION" == "reopened" ]]; then
              COLOR="warning"
            else
              COLOR="danger"
            fi
            BODY="${PR_USER_LOGIN} ${ACTION} the PR"
          fi

          # Build the Slack message text safely
          # Use $'...' quoting so \n is interpreted as a real newline by bash,
          # which jq then encodes as the JSON \n that Slack renders as a line break.
          MSG=$"*${TITLE}*"$'\n'"${BODY}"$'\n'"*Repo:* \`${REPO_NAME}\`"$'\n'"*Branch:* \`${PR_HEAD_REF}\` -> \`${PR_BASE_REF}\`"$'\n'"<${PR_URL}|View Pull Request>"

          # Use JSON-safe encoding via jq to prevent injection
          {
            echo "payload<<SLACKEOF"
            jq -n \
              --arg color "$COLOR" \
              --arg msg "$MSG" \
              '{attachments: [{color: $color, blocks: [{type: "section", text: {type: "mrkdwn", text: $msg}}]}]}'
            echo "SLACKEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        id: slack
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a  # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.details.outputs.payload }}

      - name: Slack notification warning
        if: steps.slack.outcome == 'failure'
        run: |
          echo "::warning::Slack notification could not be delivered."
          echo ""
          echo "This is an infrastructure issue, not a code problem."
          echo "Possible causes:"
          echo "  - SLACK_WEBHOOK_URL secret has expired or been rotated"
          echo "  - Slack service is temporarily unavailable"
          echo ""
          echo "Action required for maintainers: verify the SLACK_WEBHOOK_URL"
          echo "secret in Settings > Secrets and variables > Actions."
