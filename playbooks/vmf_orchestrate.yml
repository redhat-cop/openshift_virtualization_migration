---
# Orchestrator playbook — seeds AAP then launches job templates via
# the AAP API to configure a Migration Factory environment.
#
# Usage:
#   ansible-navigator run playbooks/vmf_orchestrate.yml \
#     -i inventory/rhdp.yml \
#     --limit aap-homelab \
#     --vault-password-file ~/.vault_pass

# ── Phase 1: Seed AAP ────────────────────────────────────────────────
- name: "Phase 1 | Seed AAP with Migration Factory content"
  hosts: migration_aap
  connection: local
  gather_facts: false
  tasks:
    - name: Sync project and push CaC objects to AAP
      ansible.builtin.import_role:
        name: infra.openshift_virtualization_migration.aap_seed

# ── Phase 2: Launch MTV Provider for each source-target pair ─────────
- name: "Phase 2 | Create MTV providers via AAP job templates"
  hosts: migration_aap
  connection: local
  gather_facts: false
  vars:
    _orchestrate_template: >-
      {{ aap_seed_mtv_provider_template_name
         | default('OpenShift Virtualization Migration - MTV Provider') }}
  tasks:
    - name: Build source-target credential pairs from inventory
      ansible.builtin.set_fact:
        _orchestrate_provider_jobs: >-
          {% set jobs = [] -%}
          {% for target in groups['migration_clusters'] | default([]) -%}
            {% if inventory_hostname in (hostvars[target]['aap_hosts'] | default([inventory_hostname])) -%}
              {% for source in hostvars[target]['vm_sources'] | default([]) -%}
                {% set _ = jobs.append({
                  'source_name': source,
                  'target_name': target,
                  'credentials': [source, target]
                }) -%}
              {% endfor -%}
            {% endif -%}
          {% endfor -%}
          {{ jobs }}

    - name: Display planned provider launches
      ansible.builtin.debug:
        msg: |
          Will launch {{ _orchestrate_provider_jobs | length }} provider job(s):
          {% for job in _orchestrate_provider_jobs %}
            - {{ job.source_name }} → {{ job.target_name }}
              credentials: {{ job.credentials | join(', ') }}
          {% endfor %}

    - name: Launch MTV Provider job template for each pair
      ansible.controller.job_launch:
        name: "{{ _orchestrate_template }}"
        credentials: "{{ item.credentials }}"
        wait: true
        controller_host: "{{ aap_hostname }}"
        controller_username: "{{ aap_username | default(omit) }}"
        controller_password: "{{ aap_password | default(omit) }}"
        controller_oauthtoken: "{{ aap_token | default(omit) }}"
        validate_certs: "{{ aap_validate_certs | default(true) }}"
      loop: "{{ _orchestrate_provider_jobs }}"
      loop_control:
        label: "{{ item.source_name }} → {{ item.target_name }}"
      register: _orchestrate_provider_results

    - name: Display provider job results
      ansible.builtin.debug:
        msg: >-
          {{ item.item.source_name }} → {{ item.item.target_name }}:
          Job {{ item.id | default('N/A') }} —
          {{ item.status | default('unknown') }}
      loop: "{{ _orchestrate_provider_results.results }}"
      loop_control:
        label: "{{ item.item.source_name }} → {{ item.item.target_name }}"
...
